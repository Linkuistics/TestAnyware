[package]
name = "testanyware-vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "QEMU-backed VM lifecycle for the TestAnyware host CLI."

[dependencies]
testanyware-agent-client = { path = "../testanyware-agent-client" }
# Windows golden creation provisions over the in-VM agent's HTTP surface (no
# sshd on Windows), constructing `ExecRequest` bodies directly (`golden_windows.rs`).
testanyware-protocol = { path = "../testanyware-protocol" }
# The RFB client + OCR engine power the shared frame-capture helper
# (`capture.rs`, used by `screen find-text`) and the macOS recovery driver
# (`recovery.rs`, ADR-0008). `image` encodes captured framebuffers to PNG for
# the OCR engine. All three are platform-neutral here; only `recovery.rs` is
# macOS-gated.
testanyware-rfb = { path = "../testanyware-rfb" }
testanyware-ocr-client = { path = "../testanyware-ocr-client" }
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { workspace = true }
# `CancellationToken` ends a start when the client of the TestAnyware app goes away.
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
getrandom = { workspace = true }
russh = { workspace = true }
russh-sftp = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true }
# `posix_spawn` with `POSIX_SPAWN_CLOEXEC_DEFAULT` starts the detached children (`detached.rs`),
# and `waitpid` reaps them. nix has neither flag.
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }

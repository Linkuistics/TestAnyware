[package]
name = "testanyware-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The TestAnyware app: serves guest streams on a Unix socket, behind a menu bar status item on macOS."

[lib]
name = "testanyware_app"
path = "src/lib.rs"

[[bin]]
name = "testanyware-app"
path = "src/main.rs"

[dependencies]
testanyware-app-protocol = { path = "../testanyware-app-protocol" }
# `spec` and `paths` read the VM records in the state directory. `health` and `local_network`
# hold the errno classification and the `nc` oracle that the dial reuses (ADR-0019).
testanyware-vm = { path = "../testanyware-vm" }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
# `CancellationToken` carries the end of a client's connection to the start that it asked for.
tokio-util = { workspace = true }

[target.'cfg(unix)'.dependencies]
# The app serves over HTTP/1.1 on a Unix socket (spec: "The protocol"). hyper-util
# supplies the tokio <-> hyper IO adapter, as in the agent client.
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
# `user` gives geteuid, the uid that the peer check compares with. `net` gives getifaddrs,
# which lists the networks that the host attaches.
nix = { workspace = true, features = ["user", "net"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The status item and the login item (ADR-0003: objc2 bindings, no Swift shim). Only the
# `shell` module uses them, and Linux builds never compile them.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSError", "NSObject", "NSNotification", "NSThread"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSMenu", "NSMenuItem", "NSWorkspace", "NSImage", "NSRunningApplication"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[dev-dependencies]
tempfile = { workspace = true }
# `test-util` pauses the clock, so the 5 s retry window runs in no time in a test.
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }

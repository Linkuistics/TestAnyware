[package]
name = "testanyware-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The TestAnyware app: serves guest streams on a Unix socket. This crate holds no AppKit code."

[lib]
name = "testanyware_app"
path = "src/lib.rs"

[[bin]]
name = "testanyware-app"
path = "src/main.rs"

[dependencies]
testanyware-app-protocol = { path = "../testanyware-app-protocol" }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
# The app serves over HTTP/1.1 on a Unix socket (spec: "The protocol"). hyper-util
# supplies the tokio <-> hyper IO adapter, as in the agent client.
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
# `user` gives geteuid, the uid that the peer check compares with.
nix = { workspace = true, features = ["user"] }

[dev-dependencies]
tempfile = { workspace = true }

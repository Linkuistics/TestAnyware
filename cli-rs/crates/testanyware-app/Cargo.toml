[package]
name = "testanyware-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The TestAnyware app: serves guest streams on a Unix socket. This crate holds no AppKit code."

[lib]
name = "testanyware_app"
path = "src/lib.rs"

[[bin]]
name = "testanyware-app"
path = "src/main.rs"

[dependencies]
testanyware-app-protocol = { path = "../testanyware-app-protocol" }
# `spec` and `paths` read the VM records in the state directory. `health` and `local_network`
# hold the errno classification and the `nc` oracle that the dial reuses (ADR-0019).
testanyware-vm = { path = "../testanyware-vm" }
clap = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[target.'cfg(unix)'.dependencies]
# The app serves over HTTP/1.1 on a Unix socket (spec: "The protocol"). hyper-util
# supplies the tokio <-> hyper IO adapter, as in the agent client.
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true }
http-body-util = { workspace = true }
bytes = { workspace = true }
# `user` gives geteuid, the uid that the peer check compares with. `net` gives getifaddrs,
# which lists the networks that the host attaches.
nix = { workspace = true, features = ["user", "net"] }

[dev-dependencies]
tempfile = { workspace = true }
# `test-util` pauses the clock, so the 5 s retry window runs in no time in a test.
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }

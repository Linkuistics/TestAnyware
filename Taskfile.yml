  default:
    desc: List the available tasks
    silent: true
    cmds:
      - task --list

  # ---- Rust CLI ------------------------------------------------------------

  cli:build:
    desc: Build the debug host CLI that the live checks drive
    dir: '{{.CLI_DIR}}'
    cmds:
      - cargo build -p testanyware-cli

  app:build:
    desc: Build the debug TestAnyware app executable that the live checks run in test mode
    dir: '{{.CLI_DIR}}'
    cmds:
      - cargo build -p testanyware-app

  cli:test:
    desc: Run the whole cli-rs test suite (live-VM tests stay ignored)
    dir: '{{.CLI_DIR}}'
    cmds:
      - cargo test --workspace

  ocr:vision-hang-repro:
    desc: 'Does Apple Vision still hang on this macOS host (ADR-0002)? Sends COUNT requests (default 3000) on one frame in one process, each bounded by 30 s, and fails at the first that does not return. On macOS 27.2.1 it failed in 4 of 5 runs. Several passes show that the worker child of the Vision engine may no longer be needed. Up to about 5 minutes'
    dir: '{{.CLI_DIR}}'
    env:
      TESTANYWARE_VISION_STRESS_COUNT: '{{.COUNT | default "3000"}}'
    cmds:
      - cargo test -p testanyware-ocr-client --lib -- --ignored --nocapture repeated_requests_return

  app:test:
    desc: Test the TestAnyware app, its protocol crate and its client crate. The tests run the real app executable in test mode (macOS or Linux host)
    dir: '{{.CLI_DIR}}'
    cmds:
      - cargo test -p testanyware-app-protocol -p testanyware-app -p testanyware-app-client

  app:routing-test:
    desc: Run the real host CLI binary against the real app executable and fake guests (agent, VNC) and a fake tart (vm list, vm start, vm stop and vm delete), and an app that forges its build, range and bundle build, so that each row of the version skew table is a run. The queue tests also kill the app during a boot and start it again, with a start record of the crashed run (spec admission-queue). Another run starts the app with a `tart list` that does not answer. The tick of the app observes, and the app decides again for the record, also when each later call to tart fails and while a start of the same id waits in the queue. A quit of the app (SIGTERM) while starts wait and one boots fails each client with `APP_UNREACHABLE` and cause `quitting`, leaves no clone of those starts and keeps the guest that started. A quit whose cleanup outlasts the wait (`--test-quit-wait-ms`) exits at the limit and keeps the start record, and the next start of the app decides for it. Uses the default socket on a macOS host and TESTANYWARE_APP_SOCKET elsewhere (macOS or Linux host)
    dir: '{{.CLI_DIR}}'
    cmds:
      - cargo test -p testanyware-cli --test app-agent-routing --test app-vnc-routing --test app-vm-list-routing --test app-vm-start-routing --test app-vm-queue --test app-vm-stop-delete-routing --test app-version-skew

  config:test:
    desc: Test config.rhai (ADR-0021). The evaluator and its limits, the order of the sources, the doctor `config` check, and the real CLI binary against a file that fails. On a macOS host the real CLI and the real app executable read one file, and golden creation compares its directories with the app's (golden-directory-check). The app side runs the real app executable with a file that evaluates and one that fails, the directory refusal and its remedy, a restart that reloads the file, and the tool locations (macOS host). The default file that the app writes when it finds none, with its text, the write step that never replaces an entry, and a test-mode run that writes nothing. The setting macos_slots (ADR-0022) has the check of its value in the evaluator, the Host CLI and the app, the app's share in the admission count, and the real CLI against the real app with a share of 1 and of 0 (macOS host)
    dir: '{{.CLI_DIR}}'
    cmds:
      - cargo test -p testanyware-config
      - 'cargo test -p testanyware-vm --lib -- paths:: tools::'
      - cargo test -p testanyware-vm --test configured_tools
      - cargo test -p testanyware-app-protocol config_invalid
      - 'cargo test -p testanyware-cli --lib -- host_config:: doctor:: resolve::'
      - cargo test -p testanyware-cli --test config-file --test golden-directory-check
      - 'cargo test -p testanyware-app --lib -- config:: default_file:: menu::'
      - cargo test -p testanyware-app --test configuration
      - 'cargo test -p testanyware-app --lib -- admission::tests::with_ admission::tests::the_limit_is'
      - 'cargo test -p testanyware-cli --test app-vm-queue -- with_macos_slots'

  slots:test:
    desc: Test `vm slots` and protocol version 2 (ADR-0022). The shared types of the view, the rule that a request needs a version and the remedy of the skew table, the view of the admission queue (waiters in order, who asked, holders, contention, the observation before the view), the menu, the surface, the schema and the `capabilities` list. On a macOS host the real CLI runs against the real app executable and a fake tart. Agents in two worktrees wait and the view shows their order, pids and directories. A guest outside the app is external. A client of version 1 has no such route, and an older app fails the command with APP_INCOMPATIBLE and still starts a VM
    dir: '{{.CLI_DIR}}'
    cmds:
      - 'cargo test -p testanyware-app-protocol --lib -- slots:: skew:: version:: start::'
      - 'cargo test -p testanyware-app --lib -- admission::tests::the_view admission::tests::an_ admission::tests::a_refusal_by_the_framework_shows menu::'
      - 'cargo test -p testanyware-vm --lib -- error::tests::the_remedy'
      - 'cargo test -p testanyware-cli --test cli-contract'
      - 'cargo test -p testanyware-cli --test app-vm-queue -- vm_slots the_slots_request a_start_states'
      - 'cargo test -p testanyware-cli --test app-version-skew -- vm_slots older_app_starts'

  golden:hold-test:
    desc: Test that a macOS golden creation holds a slot through one connection (ADR-0022, spec "admission-queue", "Golden creation"). The hold request and its events, the count of a hold that names several VMs, the decision that never counts a golden creation as unproven, and the queue with a golden waiter (no bound, one slot, the view). On a macOS host the hold request runs through the library of the Host CLI against the real app executable and a fake tart. Golden creation waits behind two VMs, a start beside the hold waits, a crash of the client and a quit of the app, macos_slots 0, a bad name and a client of version 1. The real vm create-golden waits for its slot after its fast checks, and an app of version 1 fails it with APP_INCOMPATIBLE
    dir: '{{.CLI_DIR}}'
    cmds:
      - 'cargo test -p testanyware-app-protocol --lib -- slots::'
      - 'cargo test -p testanyware-app --lib -- admission::count admission::decision admission::tests::a_golden admission::tests::the_view_shows_the_hold admission::tests::macos_slots_at_zero admission::tests::the_setup_vm hold::'
      - 'cargo test -p testanyware-cli --lib -- app_route::'
      - 'cargo test -p testanyware-cli --test app-vm-queue -- golden the_hold_request the_command a_host_that_fails a_setup_vm_that_still a_name_that_is_no_plain a_start_beside_the_hold'
      - 'cargo test -p testanyware-cli --test app-version-skew -- golden'

  doctor:app-test:
    desc: Test the `app` check of `doctor` (spec "What the commands report about the app"). The classifier of every item, the report against doctor.json, the status fields of the app (Local Network observation, login item, executable), and the real CLI binary against the real app executable with a directory mismatch, a protocol mismatch, a bundle newer than the app, a file that fails and an app that does not run (macOS host). A Linux or Windows host runs the not-applicable case
    dir: '{{.CLI_DIR}}'
    cmds:
      - 'cargo test -p testanyware-app-protocol --lib -- status:: bundle::'
      - 'cargo test -p testanyware-app --lib -- grant:: menu:: bundle::'
      - 'cargo test -p testanyware-cli --lib -- doctor_app::'
      - cargo test -p testanyware-cli --test doctor-app

  app:bundle-dev:
    desc: Build and sign the development bundle of the TestAnyware app, bundle id dev.antony.TestAnyware.dev (macOS host). Prints its path. The signing identity is the Developer ID of team TA43A4RUP3, and any other team is refused
    cmds:
      - scripts/build-app.sh dev

  app:bundle-live:
    desc: Live check on this Mac. Open the development bundle through LaunchServices, read GET /v1/status on the app socket, check that golden creation expects the directories that the app holds, check the login item, the executable and the Local Network observation that the real app reports and that `doctor` reports them, read the status item's menu, and quit it. Then open it again with a config.rhai that fails (TESTANYWARE_CONFIG) and check the status and the menu. Needs no guest and uses the real app socket, so quit a running app first
    deps: [cli:build]
    cmds:
      - scripts/app-bundle-live.sh

  app:routing-live:
    desc: 'Live check on this Mac, from a herdr session: with no variable set, agent snapshot, screen capture, input move and a file transfer reach a running guest through the app, and the CLI has no direct path (task app:routing-live VM=<id>). A person first starts the guest in Terminal (testanyware vm start --platform macos --id <id>) and allows the Local Network alert once. Starts the development bundle when no app answers, and quits only that one'
    deps: [cli:build]
    preconditions:
      - sh: test -n "{{.VM}}"
        msg: 'name the guest that a person started in Terminal: task app:routing-live VM=<id>'
    cmds:
      - TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/app-routing-live.sh {{.VM | shellQuote}}

  app:stream-end-live:
    desc: 'Live check on this Mac: many VNC commands to a running tart guest leave the descriptors of the app and the connections of tart in CLOSE_WAIT flat (task app:stream-end-live VM=<id> [COMMANDS=150]). tart keeps a connection open after the client has gone, so an app that waits for the guest keeps two descriptors for each command, and the app of release 2.4.0 failed after about 120. Runs the development bundle (APP=<bundle> for another), prints the counts before and after, and quits only the app it started. Quit a running app first, and open it again afterwards. A person first allows the Local Network alert for the bundle, once. Only reads from the guest'
    deps: [cli:build]
    preconditions:
      - sh: test -n "{{.VM}}"
        msg: 'name a tart guest that runs: task app:stream-end-live VM=<id>'
    cmds:
      - APP_BUNDLE={{.APP | default "" | shellQuote}} TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/app-stream-end-live.sh {{.VM | shellQuote}} {{.COMMANDS | default "150" | shellQuote}}

  app:herdr-acceptance:
    desc: 'The herdr acceptance run on this Mac, from a herdr session: with no variable set, vm start --platform macos, an agent, a screen, an input and a file command, and vm stop all go through the app, and each fails with APP_UNREACHABLE when no app answers. Prints PASS or FAIL. APP defaults to the development bundle, and the release candidate passes its own bundle (task app:herdr-acceptance APP=<bundle>). A person first allows the Local Network alert for the app, once. Starts the bundle when no app answers, quits only that one, and stops its guest on every exit. About two minutes, one free macOS guest slot'
    deps: [cli:build]
    cmds:
      - |
        app={{.APP | default "" | shellQuote}}
        [ -n "$app" ] || app=$(scripts/build-app.sh dev | tail -n 1)
        TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/herdr-acceptance-live.sh "$app"

  input:live:
    desc: 'The live checks of the input commands on this Mac, with a real macOS 27 guest (task input:live [APP=<bundle>]). It builds a small fixture window with swiftc, uploads it to the guest, and reads each effect through `agent snapshot`, never the exit status. Step 0, the oracle: `agent set-value` changes the field and the snapshot reads it. Check 1: `input click` focuses the text field and `input type` puts text in it. Check 2: `input scroll` and then `input drag` of the scroll-bar thumb each move one element of a view taller than its window. Prints PASS or FAIL for each check, names each failed step, runs every step, and exits non-zero when any step failed. APP defaults to the development bundle, and the release candidate passes its own bundle. Starts the guest with `vm start --wait`, so a taken slot makes it wait. Needs the golden image testanyware-golden-macos-27. A person first allows the Local Network alert for the app, once. Starts the bundle when no app answers, quits only that one, and stops its guest on every exit (KEEP_GUEST=1 keeps it). About five minutes'
    deps: [cli:build]
    cmds:
      - |
        app={{.APP | default "" | shellQuote}}
        [ -n "$app" ] || app=$(scripts/build-app.sh dev | tail -n 1)
        TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/input-live.sh "$app"

  queue:live:
    desc: 'The live checks of the admission queue on this Mac, with real macOS guests (task queue:live [APP=<bundle>]). Check 1: three `vm start --wait` run from three shells, the third waits at place 1, and a stop of the first admits it. Check 2: a `tart run` outside the app holds a slot and `vm slots` names it external, a start waits for the second slot only, and a second start waits until the outside guest ends. Check 3: two guests hold both slots, `vm create-golden` waits and shows a place, and Ctrl-C ends the wait and changes nothing (no golden is built). Prints PASS or FAIL for each check and exits non-zero at the first FAIL. APP defaults to the development bundle, and the release candidate passes its own bundle. Needs both macOS guest slots free and refuses, naming the guest, when a guest that it did not start runs. It never stops such a guest. Needs the golden image testanyware-golden-macos-27 (BASE=<image> for another), an SSH key and the macOS agent binary for the fast checks of golden creation. A person first allows the Local Network alert for the app, once. Starts the bundle when no app answers, quits only that one, and stops its guests on every exit. About ten minutes'
    deps: [cli:build]
    cmds:
      - |
        app={{.APP | default "" | shellQuote}}
        [ -n "$app" ] || app=$(scripts/build-app.sh dev | tail -n 1)
        TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/queue-live.sh "$app"

  app:adoption-live:
    desc: 'Live check on this Mac: VMs outlive the app, and the app adopts them. Starts a macOS guest through the app, quits the app and shows the guest runs on with the same processes, opens the app and shows it adopts the guest, and an agent and a screen command reach it. Then it removes the identity from the meta (a hand-made older meta) and shows the app adopts the guest as legacy and stops it by name. When an older Host CLI is at hand (OLD_TESTANYWARE_BIN, or the testanyware on PATH), it repeats the legacy case with a guest that CLI started. APP defaults to the development bundle (task app:adoption-live APP=<bundle>). A person first allows the Local Network alert for the app, once. Quits only the app it started, and stops its guests on every exit. About five minutes, one free macOS guest slot'
    deps: [cli:build]
    cmds:
      - |
        app={{.APP | default "" | shellQuote}}
        [ -n "$app" ] || app=$(scripts/build-app.sh dev | tail -n 1)
        TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/app-adoption-live.sh "$app"

  cli:control-old-path:
    desc: 'Old-path control of host-cli-control-k222. Builds the Host CLI of REV (default 251bf072e3, before k222) from git archive in a temporary directory, into target/control-old-path. Runs five cases of tests/host-cli-control.rs against it: the k13 CLI interruption case and the k7 download interrupt case, each once for SIGINT and once for SIGTERM, and the recorded old Linux reply with extra bytes. Passes only when each case fails on the old binary with its known defect and passes on this checkout'
    cmds:
      - scripts/cli-control-old-path.sh {{.REV | default "251bf072e3" | shellQuote}}

  cli:clippy:
    desc: Lint cli-rs (clippy has pre-existing warnings in testanyware-rfb and two large-Err sites, so this reports and never gates)
    dir: '{{.CLI_DIR}}'
    cmds:
      - cargo clippy --workspace --all-targets

  cli:fmt:
    desc: 'Check rustfmt on given files (task cli:fmt -- <files>); add FIX=1 to rewrite them. Never repo-wide: the repo has pre-existing drift'
    dir: '{{.CLI_DIR}}'
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: 'name the files to check: task cli:fmt -- crates/testanyware-vm/src/start_outcome.rs'
    cmds:
      - rustfmt --edition 2021 {{if .FIX}}{{else}}--check{{end}} {{.CLI_ARGS}}

  # ---- macOS In-VM agent ---------------------------------------------------

  agent:macos:test:
    desc: Build the macOS In-VM agent and run its Swift tests (host-side; mock elements, no guest)
    dir: '{{.ROOT_DIR}}/agents/macos'
    cmds:
      - swift build
      - swift test

  # ---- Linux In-VM agent ---------------------------------------------------

  agent:linux:test:
    desc: Run the Linux In-VM agent tests from its locked Python project, on the host and then in a pinned Linux container, where the lifecycle controls must run (Docker; no guest)
    dir: '{{.ROOT_DIR}}/agents/linux'
    vars:
      # python:3.12-slim on linux/arm64, the image of the k5 matrix
      # (experiments/exec-reliability/linux_k5.py). The daemon knows it only by digest.
      LINUX_TEST_IMAGE: python@sha256:dddfd7e07f9d15aeeca61529320492139d21cac7f0070c00609243e51e4e0016
    preconditions:
      - sh: docker image inspect {{.LINUX_TEST_IMAGE}} >/dev/null 2>&1
        msg: 'the Linux lifecycle controls need Docker and the pinned image: docker pull {{.LINUX_TEST_IMAGE}}'
    cmds:
      - uv sync --locked
      - uv run --locked ruff check .
      - uv run --locked python -m pytest -q -p no:cacheprovider
      # The container borrows pytest from the locked project. Its packages are pure Python.
      # TESTANYWARE_LINUX_CONTROLS=required turns a skipped lifecycle control into a failure.
      - >-
        deps="$(uv run --locked python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')" &&
        docker run --rm --init --network none -u 1000:1000
        -v "$PWD:/agent:ro" -v "$deps:/deps:ro"
        -e PYTHONPATH=/deps -e PYTHONDONTWRITEBYTECODE=1 -e TESTANYWARE_LINUX_CONTROLS=required
        -w /agent {{.LINUX_TEST_IMAGE}}
        python3 -m pytest -q -p no:cacheprovider

  agent:linux:record-exec-replies:
    desc: Record the Linux agent's exec replies in a pinned Linux container as Host CLI fixtures (agents/linux/tests/fixtures/exec-records; Docker; no guest)
    dir: '{{.ROOT_DIR}}/agents/linux'
    vars:
      LINUX_TEST_IMAGE: python@sha256:dddfd7e07f9d15aeeca61529320492139d21cac7f0070c00609243e51e4e0016
    cmds:
      - mkdir -p tests/fixtures/exec-records
      - >-
        docker run --rm --init --network none -u 1000:1000
        -v "$PWD:/agent:ro" -v "$PWD/tests/fixtures/exec-records:/out"
        -e PYTHONPATH=/agent -e PYTHONDONTWRITEBYTECODE=1
        -w /agent {{.LINUX_TEST_IMAGE}}
        python3 -m tests.record_exec_replies /out

  agent:macos:record-exec-replies:
    desc: Record the macOS agent's exec replies on this host as Host CLI fixtures (agents/macos/Tests/fixtures/exec-records; no guest)
    dir: '{{.ROOT_DIR}}/agents/macos'
    cmds:
      - mkdir -p Tests/fixtures/exec-records
      - TESTANYWARE_RECORD_EXEC_REPLIES="$PWD/Tests/fixtures/exec-records" swift test --filter 'ExecReplyFixtureTests/testRecordExecReplies'

  agent:macos:build:
    desc: Build the release macOS In-VM agent at agents/macos/.build/release/testanyware-agent (what a golden build installs when TESTANYWARE_AGENT_BIN_OVERRIDE names it)
    dir: '{{.ROOT_DIR}}/agents/macos'
    cmds:
      - swift build -c release

  scripts:check:
    desc: shellcheck and shfmt (-i 2 -ci) over the scripts the tasks here run
    vars:
      SCRIPTS: scripts/live-start-checks.sh scripts/qemu-tpm-check.sh scripts/windows-healthy-start.sh scripts/vnc-idle-live.sh scripts/build-app.sh scripts/app-bundle-live.sh scripts/app-routing-live.sh scripts/app-stream-end-live.sh scripts/herdr-acceptance-live.sh scripts/queue-live.sh scripts/input-live.sh scripts/app-adoption-live.sh scripts/upgrade-identity-live.sh
    cmds:
      - shellcheck -x {{.SCRIPTS}}
      - shfmt -i 2 -ci -d {{.SCRIPTS}}

  # ---- Agent skill plugin --------------------------------------------------

  plugin:check:
    desc: Validate the Claude Code plugin in plugins/testanyware, or skip when Claude Code is not installed
    cmds:
      - |
        if ! command -v claude >/dev/null 2>&1; then
          echo "skipping plugin:check: Claude Code is not installed"
          exit 0
        fi
        claude plugin validate '{{.ROOT_DIR}}/plugins/testanyware'

  # ---- Live checks (macOS host) --------------------------------------------

  vm:slot-exhaustion:
    desc: With both macOS guest slots taken, a third start fails fast with VM_LIMIT_REACHED (exit 6) and leaves no clone
    deps: [cli:build]
    cmds:
      - TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/live-start-checks.sh slot-exhaustion

  vm:slot-wait:
    desc: With both macOS guest slots taken, `vm start --wait` waits, runs out with VM_LIMIT_REACHED, and begins within seconds of a holder stopping (about 4 minutes; needs one free slot, takes the other)
    deps: [cli:build]
    cmds:
      - TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/live-start-checks.sh slot-wait

  vm:keep-on-failure:
    desc: A failed start is torn down by default and kept under --keep-on-failure (about 4 minutes). Runs its own app in test mode, with the agent probes aimed at a port that refuses
    deps: [cli:build, app:build]
    cmds:
      - TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/live-start-checks.sh keep-on-failure

  vm:qemu-death:
    desc: Killing QEMU during a Windows start's agent wait fails at once with QEMU_FAILED and leaves no VM (about a minute; needs qemu, swtpm and the Windows golden)
    deps: [cli:build]
    cmds:
      - TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/live-start-checks.sh qemu-death

  vm:qemu-start:
    desc: qemu-death, then a Windows (QEMU) start that must reach a Healthy agent (minutes)
    deps: [cli:build]
    cmds:
      - TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/live-start-checks.sh qemu-start

  vm:local-network:
    desc: 'Does a macOS start from this shell reach a Healthy agent, or fail within a minute naming the Local Network denial (cause local_network_denied, ADR-0019)? Needs one free macOS guest slot; stops its VM'
    deps: [cli:build]
    cmds:
      - TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/live-start-checks.sh local-network

  vm:list-custom-id:
    desc: 'A macOS start with an id outside the testanyware- prefix (koine-verify-<n>) is listed by vm list, enriched, and gone after vm stop. Needs one free macOS guest slot'
    deps: [cli:build]
    cmds:
      - TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/live-start-checks.sh list-custom-id

  vm:start-reliability:
    desc: 'N consecutive macOS starts must each reach a Healthy agent (task vm:start-reliability N=10)'
    deps: [cli:build]
    vars:
      RUNS: '{{.N | default "10"}}'
    cmds:
      - TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/live-start-checks.sh reliability {{.RUNS}}

  vm:qemu-tpm-check:
    desc: Does this host's QEMU run a Windows guest's TPM device as TestAnyware attaches it (ADR-0017)? Seconds; paused diskless guests, needs qemu and swtpm
    cmds:
      - scripts/qemu-tpm-check.sh

  vm:start-tpm-report-check:
    desc: Does `vm start --dry-run` report the Windows TPM decision (attached here), and refuse with SWTPM_MISSING when swtpm is hidden? Seconds; no VM is started
    deps: [cli:build]
    vars:
      CLI: '{{.CLI_DIR}}/target/debug/testanyware'
    cmds:
      - '{{.CLI}} vm start --platform windows --dry-run --json | grep -q ''"attached": true'''
      - '{{.CLI}} vm start --platform windows --dry-run 2>&1 | grep -q "TPM attached"'
      # A trimmed PATH cannot hide swtpm: the CLI's `which` always adds
      # /opt/homebrew/bin and /usr/local/bin on macOS. A sandbox denying
      # that one file to the CLI process can. The `ls` is the control: it
      # must fail under the same profile, or the sandbox is hiding nothing.
      - |
        profile='(version 1)(allow default)(deny file-read-metadata file-read-data (literal "/opt/homebrew/bin/swtpm"))'
        if sandbox-exec -p "$profile" /bin/ls /opt/homebrew/bin/swtpm >/dev/null 2>&1; then
          echo "control failed: the sandbox does not hide swtpm" >&2; exit 1
        fi
        out=$(sandbox-exec -p "$profile" {{.CLI}} vm start --platform windows --dry-run --json) && exit 1
        echo "$out" | grep -q '"code": "SWTPM_MISSING"'
        echo "$out" | grep -q 'brew install swtpm'

  doctor:tpm-check:
    desc: Does `doctor` report the Windows TPM decision (attached, PPI off here), and fail with SWTPM_MISSING when swtpm is hidden? Seconds; no VM is started
    deps: [cli:build]
    vars:
      CLI: '{{.CLI_DIR}}/target/debug/testanyware'
    cmds:
      - '{{.CLI}} doctor --json | grep -q ''"attached": true'''
      - '{{.CLI}} doctor | grep -q "Windows guests: TPM attached (PPI off)"'
      # As in vm:start-tpm-report-check: the `ls` is the control and must fail
      # under the sandbox, or the sandbox is hiding nothing. A refused TPM
      # makes doctor exit 1.
      - |
        profile='(version 1)(allow default)(deny file-read-metadata file-read-data (literal "/opt/homebrew/bin/swtpm"))'
        if sandbox-exec -p "$profile" /bin/ls /opt/homebrew/bin/swtpm >/dev/null 2>&1; then
          echo "control failed: the sandbox does not hide swtpm" >&2; exit 1
        fi
        out=$(sandbox-exec -p "$profile" {{.CLI}} doctor --json) && { echo "doctor exited 0 with swtpm hidden" >&2; exit 1; }
        echo "$out" | grep -q '"code": "SWTPM_MISSING"'
        echo "$out" | grep -q 'brew install swtpm'

  vm:windows-healthy-start:
    desc: 'Does one `vm start --platform windows` reach a Healthy agent, unaided, with the TPM attached? Optional BASE=<golden>. About 2.5 minutes (10 to 14 if the agent never answers); always stops and deletes the clone'
    deps: [cli:build]
    cmds:
      - scripts/windows-healthy-start.sh {{.BASE}}

  vm:tart-vnc-idle-repro:
    desc: 'Does tart abort when a VNC client connects after GAP seconds (default 70) with no client? Reproduces the macOS 27 host fault with a bare RFB client; exits 1 on a crash. Optional BASE=<golden>, HOLD=1 to keep a bare TCP connection open (the workaround; expect no crash). About 2.5 minutes; always stops and deletes the clone'
    cmds:
      - python3 scripts/tart-vnc-idle-repro.py --gap {{.GAP | default "70"}} {{if .BASE}}--base {{.BASE}}{{end}} {{if .HOLD}}--hold{{end}}

  vm:vnc-idle-live:
    desc: 'Does a tart guest survive idle time with no VNC client on this host (ADR-0018)? Through the app of the bundle (task vm:vnc-idle-live [APP=<bundle>]), a macOS guest that `vm start` starts takes two `screen size` commands 5 s apart and then 5 minutes with no VNC client, and a Linux guest 70 s. A `screen size` then works on each guest, and no `_vnc-keeper` process exists. The first `screen size` of each guest must be EXPECT_SIZE (default 1920x1080), because the VNC size wait at the end of `vm start` hides the stale first size of tart. It prints the start output of each guest and says whether it names the wait. APP defaults to the development bundle. Starts the bundle when no app answers, quits only that one, and refuses another app on the socket. Optional MACOS_BASE, LINUX_BASE, IDLE, GAP, EXPECT_SIZE. About 10 minutes; always stops its guests'
    deps: [cli:build]
    cmds:
      - |
        app={{.APP | default "" | shellQuote}}
        [ -n "$app" ] || app=$(scripts/build-app.sh dev | tail -n 1)
        TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/vnc-idle-live.sh "$app"

  vm:golden-name-free:
    desc: 'Refuse a golden NAME that `vm list --json --all` or `tart list --format json` already lists, and refuse when either inventory cannot be read (exit 1 present, 2 unreadable). Both golden recipes run it before any create, so a retained golden is never replaced. Optional GUARD_CLI and GUARD_TART name the executables; the fixture controls pass fakes. Reads only'
    vars:
      GUARD_CLI: '{{.GUARD_CLI | default "testanyware"}}'
      GUARD_TART: '{{.GUARD_TART | default "tart"}}'
    preconditions:
      - sh: test -n {{.NAME | shellQuote}}
        msg: 'set NAME=<a golden name that does not exist yet>'
    cmds:
      - python3 -I '{{.ROOT_DIR}}/scripts/vm_inventory.py' absent {{.NAME | shellQuote}} --cli {{.GUARD_CLI | shellQuote}} --tart {{.GUARD_TART | shellQuote}}

  vm:create-golden-macos:
    desc: 'Build a macOS golden of a new NAME that carries the agent of this checkout, not the Homebrew-bundled one. The guard refuses a NAME that exists. Optional VERSION is the macOS major (default 27). The golden holds the latest release of the major. When the base VM of that release does not exist, the build makes it from Apple''s IPSW (about 25 GB download) and deletes the older bases and IPSWs. About 20 minutes when the base exists. Run it from a terminal that may reach guest IPs (macOS Local Network permission). vm:refresh-golden-macos replaces the golden of the default name'
    deps: [cli:build, agent:macos:build]
    vars:
      CLI: '{{.CLI_DIR}}/target/debug/testanyware'
    env:
      TESTANYWARE_AGENT_BIN_OVERRIDE: '{{.ROOT_DIR}}/agents/macos/.build/release/testanyware-agent'
    preconditions:
      - sh: test -n {{.NAME | shellQuote}}
        msg: 'set NAME=<a golden name that does not exist yet>'
    cmds:
      - task: vm:golden-name-free
        vars: {NAME: '{{.NAME}}', GUARD_CLI: '{{.CLI}}'}
      - '{{.CLI}} vm create-golden --platform macos --version {{.VERSION | default "27"}} --name {{.NAME | shellQuote}}'

  vm:refresh-golden-macos:
    desc: 'Refresh the macOS golden of the default name (testanyware-golden-macos-<VERSION>) to the latest release of its major, with the agent of this checkout (ADR-0027). Optional VERSION is the macOS major (default 27). It skips the name guard of vm:create-golden-macos, because the refresh replaces that golden, and only when the new golden is ready. Run `testanyware vm create-golden --platform macos --dry-run` first: it names the release and says whether the base is built again (about 25 GB download, and about 10 more minutes). Run it from a terminal that may reach guest IPs (macOS Local Network permission)'
    deps: [cli:build, agent:macos:build]
    vars:
      CLI: '{{.CLI_DIR}}/target/debug/testanyware'
    env:
      TESTANYWARE_AGENT_BIN_OVERRIDE: '{{.ROOT_DIR}}/agents/macos/.build/release/testanyware-agent'
    cmds:
      - '{{.CLI}} vm create-golden --platform macos --version {{.VERSION | default "27"}}'

  vm:create-golden-linux:
    desc: 'Build a Linux golden that carries this checkout''s agent, not the Homebrew-bundled one. Needs NAME=<golden> (use a new name: a rebuild replaces a golden of the same name); optional VERSION (default 24.04). The build grows the disk to 50 GB and fails when / is under 40 GB. About 20 to 40 minutes. It pulls the Cirrus Labs image again and installs every pending update. Run it from a terminal that may reach guest IPs (macOS Local Network permission). vm:refresh-golden-linux replaces the golden of the default name'
    deps: [cli:build]
    vars:
      CLI: '{{.CLI_DIR}}/target/debug/testanyware'
    env:
      TESTANYWARE_AGENT_BIN_OVERRIDE: '{{.ROOT_DIR}}/agents/linux'
    preconditions:
      - sh: test -n {{.NAME | shellQuote}}
        msg: 'set NAME=<a golden name that does not exist yet>'
    cmds:
      - task: vm:golden-name-free
        vars: {NAME: '{{.NAME}}', GUARD_CLI: '{{.CLI}}'}
      - '{{.CLI}} vm create-golden --platform linux --version {{.VERSION | default "24.04"}} --name {{.NAME | shellQuote}}'

  vm:refresh-golden-linux:
    desc: 'Refresh the Linux golden of the default name (testanyware-golden-linux-<VERSION>) to the latest release of its major, with the agent of this checkout (ADR-0027). Optional VERSION is the Ubuntu release (default 24.04). The build pulls the Cirrus Labs image again (about 5 GB when the tag moved) and installs every pending update with apt-get full-upgrade. A failed update fails the build. It skips the name guard of vm:create-golden-linux, because the refresh replaces that golden, and only when the new golden is ready. `testanyware vm create-golden --platform linux --dry-run` names the image and says whether the run replaces a golden. About 20 to 40 minutes. Run it from a terminal that may reach guest IPs (macOS Local Network permission)'
    deps: [cli:build]
    vars:
      CLI: '{{.CLI_DIR}}/target/debug/testanyware'
    env:
      TESTANYWARE_AGENT_BIN_OVERRIDE: '{{.ROOT_DIR}}/agents/linux'
    cmds:
      - '{{.CLI}} vm create-golden --platform linux --version {{.VERSION | default "24.04"}}'

  vm:linux-golden-disk-live:
    desc: 'Does a clone of a Linux golden have the free disk that golden creation grows it for? Needs GOLDEN=<golden>; starts a clone, reads `df` of /, and fails when under MIN_AVAIL_GB (default 30) is available. A grown golden gives about 36 GB; one built before the growth gives about 8.8 GB. About 1 minute; always stops and deletes the clone. Run it from a terminal that may reach guest IPs (macOS Local Network permission)'
    deps: [cli:build]
    preconditions:
      - sh: test -n "{{.GOLDEN}}"
        msg: 'set GOLDEN=<a Linux golden>'
    cmds:
      - scripts/linux-golden-disk-live.sh {{.GOLDEN}}

  vm:ipsw-base-live:
    desc: 'Does `ensure_base_vm` build the base VM of the latest macOS 27 release (testanyware-base-macos-<version>-<build>) from Apple''s IPSW, and does the result pass its contract (SSH admin/admin, passwordless sudo, auto-login, no sleep)? It builds nothing when that base exists. Then it deletes the older macOS 27 bases and the cached IPSWs of other releases, as golden creation does. A new release downloads about 25 GB. The install takes about 4 minutes and Setup Assistant about 5 more. Run from a terminal that may reach guest IPs (macOS Local Network permission)'
    dir: '{{.CLI_DIR}}'
    deps: [cli:build]
    env:
      TESTANYWARE_LIVE_IPSW_BASE: '1'
      TESTANYWARE_VISION_WORKER: '{{.BIN}}'
    cmds:
      - cargo test -p testanyware-vm --test ipsw-base-live -- --ignored --nocapture ensure_base_vm_live

  vm:setup-assistant-live:
    desc: 'Iterate on the Setup Assistant driver: run it against a clone of a never-booted IPSW VM, then check the result. Needs FRESH=<vm> (make one with `tart create <vm> --from-ipsw <cached ipsw>`); about 5 minutes, no reinstall. Keeps the clone as testanyware-base-livetest'
    dir: '{{.CLI_DIR}}'
    deps: [cli:build]
    env:
      TESTANYWARE_LIVE_IPSW_BASE: '1'
      TESTANYWARE_IPSW_FRESH_VM: '{{.FRESH}}'
      TESTANYWARE_IPSW_KEEP: '1'
      TESTANYWARE_VISION_WORKER: '{{.BIN}}'
    preconditions:
      - sh: test -n "{{.FRESH}}"
        msg: 'set FRESH=<a never-booted VM made by `tart create --from-ipsw`>'
    cmds:
      - cargo test -p testanyware-vm --test ipsw-base-live -- --ignored --nocapture configure_fresh_clone_live

  # ---- Release (wrappers over scripts/release-*.sh; arguments pass through) --

  release:doctor:
    desc: Check the prerequisites for the release pipeline (read-only)
    cmds:
      - scripts/release-doctor.sh {{.CLI_ARGS}}

  release:candidate:
    desc: 'Build a release candidate of a local annotated tag: TAG=vX.Y.Z. Builds the notarised app and its zip, the archives of every target, the formula, the cask and manifest.json in target/candidates/<tag>. The tree must be clean and HEAD must be the tagged commit (in a jj checkout: git tag -a vX.Y.Z -m "Release vX.Y.Z" <commit>, then jj new <commit>). Publishes nothing. Long, and needs the notary profile of release:doctor'
    requires:
      vars: [TAG]
    cmds:
      - scripts/release-build.sh {{.TAG}}

  release:candidate-verify:
    desc: 'Verify a built candidate, read-only: TAG=vX.Y.Z. The local tag must still name the commit of manifest.json, and each artifact must have its recorded sha256. Prints the tag, the commit and the hashes that the later checks record'
    requires:
      vars: [TAG]
    cmds:
      - scripts/release_candidate.py verify --dir target/candidates/{{.TAG}} --tag {{.TAG}}

  release:linux-harness:
    desc: 'Run the Linux host harness of ADR-0009 on the aarch64 Linux binary of a candidate: TAG=vX.Y.Z (macOS host). Verifies the candidate, unpacks its archive into target/candidates/<tag>.checks/linux, and runs the ignored test with TESTANYWARE_LINUX_HARNESS=1, TESTANYWARE_LINUX_BIN and the ffmpeg libraries of the archive. Prints the sha256 of the archive and of the binary. The x86_64 builds are build-only, by an accepted limit. Runs from an agent session that has no Local Network access of its own: the harness forward opens guest streams of the app, and a person only needs to allow the app once. Needs the TestAnyware app running and allowed, the Linux golden testanyware-golden-linux-24.04 as a tart guest (a same-named qcow2 stops the run), a free macOS guest slot and the network. A long run'
    requires:
      vars: [TAG]
    cmds:
      - scripts/release_candidate.py verify --dir target/candidates/{{.TAG}} --tag {{.TAG}}
      - |
        set -eu
        set -o pipefail
        out="$PWD/target/candidates/{{.TAG}}.checks/linux"
        archive="$PWD/target/candidates/{{.TAG}}/testanyware-{{.TAG}}-aarch64-unknown-linux-gnu.tar.xz"
        rm -rf "$out"
        mkdir -p "$out"
        tar -xJf "$archive" -C "$out" --strip-components=1
        shasum -a 256 "$archive" "$out/bin/testanyware"
        cd cli-rs
        TESTANYWARE_LINUX_HARNESS=1 TESTANYWARE_LINUX_BIN="$out/bin/testanyware" TESTANYWARE_FFMPEG_LIB_DIR="$out/lib" \
          cargo test -p testanyware-cli --test linux-host-harness -- --ignored --nocapture linux_host_harness 2>&1 | tee "$out/harness.log"
        grep -q '^test result: ok. 1 passed' "$out/harness.log" || { echo "the Linux harness did not report 1 passed test" >&2; exit 1; }

  release:upgrade-check:
    desc: 'Live check on this Mac: a cask upgrade keeps the identity of the app. OLD=vX.Y.Z is a throwaway candidate (task release:candidate) with a lower version, and TAG=vX.Y.Z is the release candidate. A local tap holds both casks with their urls on the local zips, and nothing is published. It installs OLD and starts a guest through it, then runs brew upgrade --cask to TAG. It checks the signing identity, the approval of the first start, the executable UUID, the guest and its processes, the adoption, and the first command to the guest. A person answers the first-start dialog and allows the Local Network alert once, and again when the upgrade asks. The run stops at such a step (exit 3), names it, and goes on when run again. Needs a free macOS guest slot, no other app on the socket, and /Applications/TestAnyware.app not installed. Run release:upgrade-check-clean afterwards'
    requires:
      vars: [OLD, TAG]
    cmds:
      - scripts/upgrade-identity-live.sh run {{.OLD}} {{.TAG}}

  release:upgrade-check-clean:
    desc: 'End the upgrade check: OLD=vX.Y.Z TAG=vX.Y.Z. Stops its guest, quits the app, uninstalls the cask, removes the local tap, the scratch directory, the candidate directory of OLD and the local tag OLD. It refuses a tag that exists on the remote. OLD never reaches release:publish'
    requires:
      vars: [OLD, TAG]
    cmds:
      - scripts/upgrade-identity-live.sh clean {{.OLD}} {{.TAG}}

  release:app-verify:
    desc: 'Verify the release identity of an app bundle: APP=<bundle>. Bundle id dev.antony.TestAnyware, team TA43A4RUP3, hardened runtime, codesign --verify, spctl --assess as Notarized Developer ID, stapler validate. A development bundle fails'
    requires:
      vars: [APP]
    cmds:
      - scripts/verify-app.sh {{.CLI_ARGS}} "{{.APP}}"

  release:app-notarize:
    desc: 'Notarise, staple and zip a signed release bundle: APP=<bundle> OUT=<zip>. release:candidate does this for a candidate. Needs the notary profile of release:doctor'
    requires:
      vars: [APP, OUT]
    cmds:
      - scripts/notarize-app.sh "{{.APP}}" "{{.OUT}}"

  release:test:
    desc: Test the release pipeline without Apple, GitHub or the cross builds. The tag gate, the manifest and the rendering (python unittest in a scratch repository), the cask template, the identity refusals of verify-app.sh on a signed bundle, and release-publish.sh against local bare repositories and a fake gh (macOS host)
    cmds:
      - scripts/tests/release-pipeline-test.sh

  release:publish:
    desc: 'Publish a recorded candidate: TAG=vX.Y.Z. Pushes the existing local tag, creates the GitHub Release with the candidate archives, then pushes the formula and the cask to the tap. It never creates a tag and never rebuilds. Outward-facing'
    prompt: This pushes a tag, publishes a GitHub Release and pushes the Homebrew tap. Continue?
    requires:
      vars: [TAG]
    cmds:
      - scripts/release-publish.sh {{.TAG}}


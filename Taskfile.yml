# Reusable development tasks for TestAnyware. Local only: releases and live checks
# run on an arm64 Mac, and CI is deliberately not used. Run `task --list`.
#
# Grown from need: the Rust CLI's test/lint loop, the live `vm start` checks, the
# macOS agent, the golden builds and thin wrappers over scripts/release-*.sh.
version: '3'

vars:
  CLI_DIR: '{{.ROOT_DIR}}/cli-rs'
  BIN: '{{.ROOT_DIR}}/cli-rs/target/debug/testanyware'

tasks:
  diagnostic:failure-preserve:
    desc: Snapshot or compare all earlier evidence before and after the k149 controls
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [MODE]
    cmds:
      - uv run --locked python evidence/failure-controls-k149/preserve.py {{.MODE | shellQuote}}

  diagnostic:setuid-kill:
    desc: Retain actual setuid-ps KILL controls through the real helper engine
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python evidence/failure-controls-k149/setuid_ps_kill.py {{.OUT | shellQuote}} --trials {{.TRIALS | default "5"}} {{if .MUTANT}}--mutant {{.MUTANT | shellQuote}}{{end}}

  diagnostic:scope-readiness:
    desc: Reproduce the k145 interrupted live-group shape with declared child readiness
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [INPUTS, OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python evidence/failure-controls-k149/scope_readiness.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} --repeat {{.REPEAT | default "3"}}

  diagnostic:scope-readiness-k151:
    desc: Rerun the k145 readiness control with the k151 child audit (absent, present or unknown)
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [INPUTS, OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python evidence/failure-controls-k151/scope_readiness.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} --repeat {{.REPEAT | default "3"}}

  diagnostic:absence-controls:
    desc: Show that the k149 absence predicate fails and the k151 verdict passes on real ps results
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python evidence/failure-controls-k151/absence_controls.py {{.OUT | shellQuote}}

  diagnostic:admission-timing:
    desc: Separate reap cutoff admission from syscall execution for one input set
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [INPUTS, OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python evidence/failure-controls-k149/admission_timing.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} --repeat {{.REPEAT | default "5"}}

  diagnostic:failure-prepare:
    desc: Freeze one k149 input set with an optional declared mutation
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [SOURCE, DEST]
    cmds:
      - uv run --locked python evidence/failure-controls-k149/prepare.py {{.SOURCE | shellQuote}} {{.DEST | shellQuote}} {{if .MUTANT}}--mutant {{.MUTANT | shellQuote}}{{end}}

  diagnostic:failure-timing-tests:
    desc: Run the repaired cutoff timing tests in one frozen input set with retained receipts
    dir: '{{.INPUTS}}'
    requires:
      vars: [INPUTS, OUT]
    env:
      DIAGNOSTIC_EVIDENCE: '{{.OUT}}/receipts'
    cmds:
      - mkdir -p {{.OUT | shellQuote}}
      - uv run --locked --isolated --python 3.12 python -m pytest -vv -p no:cacheprovider --junitxml={{.OUT | shellQuote}}/pytest.xml test_worker_capture.py::test_worker_shutdown_deadline_closes_owner_operations test_shutdown.py::test_declared_shutdown_real_child_phases

  diagnostic:late-identity-tests:
    desc: Run the late-created identity fixture tests in one frozen input set with retained receipts
    dir: '{{.INPUTS}}'
    requires:
      vars: [INPUTS, OUT]
    env:
      DIAGNOSTIC_EVIDENCE: '{{.OUT}}/receipts'
    cmds:
      - mkdir -p {{.OUT | shellQuote}}
      - uv run --locked --isolated --python 3.12 python -m pytest -vv -p no:cacheprovider --junitxml={{.OUT | shellQuote}}/pytest.xml test_worker_capture.py -k late_created_identity

  diagnostic:failure-full-suite:
    desc: Run the full exec-reliability suite in one frozen k149 input set with retained receipts
    dir: '{{.INPUTS}}'
    requires:
      vars: [INPUTS, OUT]
    env:
      DIAGNOSTIC_EVIDENCE: '{{.OUT}}/receipts'
    cmds:
      - mkdir -p {{.OUT | shellQuote}}
      - uv run --locked --isolated --python 3.12 python -m pytest -q -p no:cacheprovider --junitxml={{.OUT | shellQuote}}/pytest.xml

  diagnostic:eof-order-tests:
    desc: Run the fork-failure EOF-order controls in one frozen input set with retained receipts
    dir: '{{.INPUTS}}'
    requires:
      vars: [INPUTS, OUT]
    env:
      DIAGNOSTIC_EVIDENCE: '{{.OUT}}/receipts'
    cmds:
      - mkdir -p {{.OUT | shellQuote}}
      - uv run --locked --isolated --python 3.12 python -m pytest -vv -p no:cacheprovider --junitxml={{.OUT | shellQuote}}/pytest.xml test_worker_capture.py -k "fork_failure_lost_result_eof_order or (worker_fork_failure_evidence and lost-result)"

  diagnostic:foreign-denial:
    desc: Drive real controller termination against a separately owned foreign-UID fixture (pass SELF=1 for the owned plumbing check)
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [INPUTS, OUT]
    vars:
      OWNER: '{{.OWNER | default ""}}'
      SELF: '{{.SELF | default ""}}'
    cmds:
      - uv run --locked --isolated --python 3.12 python -I evidence/failure-controls-k149/foreign_denial.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} {{if .SELF}}--self-fixture{{else}}--owner-dir {{.OWNER | shellQuote}}{{end}}

  diagnostic:scope-parent-tests:
    desc: Run the scope-parent group tests in one frozen input set with retained receipts
    dir: '{{.INPUTS}}'
    requires:
      vars: [INPUTS, OUT]
    env:
      DIAGNOSTIC_EVIDENCE: '{{.OUT}}/receipts'
    cmds:
      - mkdir -p {{.OUT | shellQuote}}
      - uv run --locked --isolated --python 3.12 python -m pytest -vv -p no:cacheprovider --junitxml={{.OUT | shellQuote}}/pytest.xml test_controller.py -k "exited_leader_does_not_hide or live_group_is_failure_even"

  diagnostic:ps-latency:
    desc: Measure real ps latency idle, under CPU load and against exiting processes
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python -I evidence/failure-controls-k149/ps_latency.py {{.OUT | shellQuote}}

  diagnostic:exiting-leader:
    desc: Run real slow-exiting group leaders through one frozen controller input set
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [INPUTS, OUT]
    vars:
      REPEAT: '{{.REPEAT | default "10"}}'
    cmds:
      - uv run --locked --isolated --python 3.12 python -I evidence/failure-controls-k149/exiting_leader.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} --repeat {{.REPEAT}}

  diagnostic:exit-latency:
    desc: Measure scope-parent leader exit latency after group TERM for one input set
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [INPUTS, OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python evidence/failure-controls-k149/exit_latency.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} --repeat {{.REPEAT | default "20"}} --load {{.LOAD | default "0"}}

  diagnostic:failure-tools:
    desc: Check k149 and k151 failure-control evidence tooling
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    cmds:
      - uv run --locked python -m ruff check evidence/failure-controls-k149/*.py
      - uv run --locked python -m ruff format --check evidence/failure-controls-k149/*.py
      - uv run --locked python -m pyright evidence/failure-controls-k149/*.py
      - uv run --locked python -m ruff check evidence/failure-controls-k151/*.py
      - uv run --locked python -m ruff format --check evidence/failure-controls-k151/*.py
      - uv run --locked python -m pyright evidence/failure-controls-k151/*.py

  diagnostic:soak-tools:
    desc: Check the k152 soak, timeline and control tooling
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    cmds:
      - uv run --locked python -m ruff check evidence/historical-soak-k152/*.py
      - uv run --locked python -m ruff format --check evidence/historical-soak-k152/*.py
      - uv run --locked python -m pyright evidence/historical-soak-k152/*.py

  diagnostic:soak-control:
    desc: Run the k152 frozen timing control once in frozen INPUTS, into a new OUT directory
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [INPUTS, OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python evidence/historical-soak-k152/soak.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} --plan evidence/historical-soak-k152/control-plan.json
      - uv run --locked --isolated --python 3.12 python evidence/historical-soak-k152/control.py {{.OUT | shellQuote}} {{.OUT | shellQuote}}/control.json

  diagnostic:soak:
    desc: Run the k152 soak once to its frozen plan in frozen INPUTS, into a new OUT directory
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [INPUTS, OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python evidence/historical-soak-k152/soak.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} --plan evidence/historical-soak-k152/plan.json

  diagnostic:soak-analyse:
    desc: Classify each run of a finished k152 SOAK directory against the open cases
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [SOAK]
    cmds:
      - uv run --locked --isolated --python 3.12 python evidence/historical-soak-k152/analyse.py {{.SOAK | shellQuote}} {{.SOAK | shellQuote}}/analysis.json

  diagnostic:overlap-audit:
    desc: Verify retained worker overlap comparisons and independent receipts
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [OUT]
    cmds:
      - uv run --locked python evidence/worker-overlap-k146/audit.py {{.OUT | shellQuote}}

  diagnostic:overlap-tools:
    desc: Check worker overlap evidence tooling
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    cmds:
      - uv run --locked python -m ruff check evidence/worker-overlap-k146/*.py
      - uv run --locked python -m ruff format --check evidence/worker-overlap-k146/*.py
      - uv run --locked python -m pyright evidence/worker-overlap-k146/audit.py evidence/worker-overlap-k146/prepare.py evidence/worker-overlap-k146/preserve.py evidence/worker-overlap-k146/run_condition.py
      - uv run --locked python -m pytest -q evidence/worker-overlap-k146/test_audit.py

  diagnostic:overlap-prose:
    desc: Check prose for the worker overlap increment
    requires:
      vars: [FILES]
    cmds:
      - python3 /Users/antony/.cache/ravel/skills/v1/snapshots/56bcd07b87f46a7b9ff92eed5a5a128f10d3ce64be2f7d934be898e058782212/tree/craft/technical-communication/scripts/ste-lint.py {{.FILES}}

  diagnostic:overlap-prepare:
    desc: Freeze worker/teardown overlap inputs in a fresh directory
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [INPUTS, OUT]
    cmds:
      - uv run --locked python evidence/worker-overlap-k146/prepare.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} {{if .MUTANT}}--mutant {{.MUTANT | shellQuote}}{{end}} {{if .BASELINE}}--baseline {{.BASELINE | shellQuote}}{{end}}

  diagnostic:overlap-check:
    desc: Retain bounded frozen worker/teardown checks
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [INPUTS, OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python evidence/worker-overlap-k146/run_condition.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} {{.MODE | default "controls" | shellQuote}} {{if .SELECT}}--select {{.SELECT | shellQuote}}{{end}}

  diagnostic:overlap-preserve:
    desc: Inventory and compare all earlier evidence bytes
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [MODE]
    cmds:
      - uv run --locked python evidence/worker-overlap-k146/preserve.py {{.MODE | shellQuote}}

  diagnostic:overlap-format:
    desc: Format worker overlap sources and tooling before measurements
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    cmds:
      - uv run --locked python -m ruff format controller.py worker_capture.py test_controller.py evidence/worker-overlap-k146/*.py

  diagnostic:scope-preserve:
    desc: Verify every prior evidence path for the scope readiness repair
    dir: experiments/exec-reliability
    cmds:
      - uv run --locked python evidence/scope-readiness-k143/preserve.py {{.MODE | shellQuote}}

  diagnostic:scope-prepare:
    desc: Freeze all diagnostic inputs for the scope readiness repair
    dir: experiments/exec-reliability
    cmds:
      - uv run --locked python evidence/scope-readiness-k143/prepare.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} {{if .MUTANT}}--mutant {{.MUTANT | shellQuote}}{{end}}

  diagnostic:scope-check:
    desc: Retain bounded scope readiness controls or the full diagnostic suite
    dir: experiments/exec-reliability
    cmds:
      - uv run --locked --isolated --python 3.12 python evidence/scope-readiness-k143/run_condition.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} {{.MODE | default "controls" | shellQuote}} {{if .SELECT}}--select {{.SELECT | shellQuote}}{{end}}

  diagnostic:scope-tools:
    desc: Format and check scope readiness subjects and tools
    dir: experiments/exec-reliability
    cmds:
      - uv run --locked python -m ruff format peer.py test_controller.py evidence/scope-readiness-k143/*.py
      - uv run --locked python -m ruff check peer.py test_controller.py evidence/scope-readiness-k143/*.py
      - uv run --locked python -m pyright peer.py evidence/scope-readiness-k143/prepare.py evidence/scope-readiness-k143/preserve.py evidence/scope-readiness-k143/run_condition.py

  diagnostic:caller-fix-prepare:
    desc: Freeze k145 cleanup inputs in a new OUT directory
    dir: experiments/exec-reliability
    cmds:
      - uv run --locked python evidence/caller-cleanup-k145/prepare.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} {{if .MUTANT}}--mutant {{.MUTANT | shellQuote}}{{end}}

  diagnostic:caller-fix-check:
    desc: Retain k145 controls, full suite or static checks in a new OUT directory
    dir: experiments/exec-reliability
    cmds:
      - uv run --locked --isolated --python 3.12 python evidence/caller-cleanup-k145/run_condition.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} {{.MODE | default "controls" | shellQuote}}

  diagnostic:caller-fix-preserve:
    desc: Verify earlier evidence, allowing only the named k140 report correction
    dir: experiments/exec-reliability
    cmds:
      - uv run --locked python evidence/caller-cleanup-k145/preserve.py {{.MODE | shellQuote}}

  diagnostic:caller-fix-tools:
    desc: Format or check k145 tools and regression controls
    dir: experiments/exec-reliability
    cmds:
      - uv run --locked python -m ruff format {{.CLI_ARGS}} evidence/caller-cleanup-k145/*.py test_turns.py
      - uv run --locked python -m ruff check evidence/caller-cleanup-k145/*.py worker_capture.py test_turns.py
      - uv run --locked --isolated --python 3.12 python -m pytest -q evidence/caller-cleanup-k145/test_audit.py
      - uv run --locked python -m pyright evidence/caller-cleanup-k145/prepare.py evidence/caller-cleanup-k145/preserve.py evidence/caller-cleanup-k145/run_condition.py

  diagnostic:caller-prepare:
    desc: Freeze caller scheduling subjects
    dir: experiments/exec-reliability
    requires:
      vars: [INPUTS, OUT]
    cmds:
      - uv run --locked python evidence/caller-scheduling-k140/prepare.py '{{.INPUTS}}' '{{.OUT}}' {{if .MUTANT}}--mutant '{{.MUTANT}}'{{end}}

  diagnostic:caller-check:
    desc: Retain bounded frozen caller scheduling controls and checks
    dir: experiments/exec-reliability
    requires:
      vars: [INPUTS, OUT, MODE]
    cmds:
      - uv run --locked --isolated --python 3.12 python evidence/caller-scheduling-k140/run_condition.py '{{.INPUTS}}' '{{.OUT}}' '{{.MODE}}'

  diagnostic:caller-preserve:
    desc: Inventory all prior diagnostic evidence
    dir: experiments/exec-reliability
    requires:
      vars: [MODE]
    cmds:
      - uv run --locked python evidence/caller-scheduling-k140/preserve.py '{{.MODE}}'

  diagnostic:caller-tools:
    desc: Format and check caller scheduling tools
    dir: experiments/exec-reliability
    cmds:
      - uv run --locked python -m ruff format evidence/caller-scheduling-k140/*.py
      - uv run --locked python -m ruff check evidence/caller-scheduling-k140/*.py
      - uv run --locked python -m pytest -q evidence/caller-scheduling-k140/test_audit.py
      - uv run --locked python -m pyright evidence/caller-scheduling-k140/prepare.py evidence/caller-scheduling-k140/preserve.py evidence/caller-scheduling-k140/run_condition.py

  diagnostic:expired-request-verify:
    dir: experiments/exec-reliability
    cmds:
      - uv run --locked python evidence/expired-request-controls-k137/verify.py '{{.OUT | default "comparison.json"}}'
  diagnostic:expired-request-tools:
    desc: Format and check expired request evidence tools
    dir: experiments/exec-reliability
    cmds:
      - uv run --locked python -m ruff format evidence/expired-request-controls-k137/*.py
      - uv run --locked python -m ruff check evidence/expired-request-controls-k137/*.py
      - uv run --locked python -m pyright evidence/expired-request-controls-k137/*.py

  diagnostic:expired-review-prepare:
    desc: Freeze expired request controls and named ownership regressions
    dir: experiments/exec-reliability
    requires:
      vars: [INPUTS, OUT]
    cmds:
      - uv run --locked python evidence/expired-request-review-k142/prepare.py '{{.INPUTS}}' '{{.OUT}}' {{if .MUTANT}}--mutant '{{.MUTANT}}'{{end}}

  diagnostic:expired-review-check:
    desc: Retain bounded frozen expired request controls, suites and statics
    dir: experiments/exec-reliability
    requires:
      vars: [INPUTS, OUT, MODE]
    cmds:
      - uv run --locked {{if .PYTHON}}--isolated --python '{{.PYTHON}}'{{end}} python evidence/expired-request-review-k142/run_condition.py '{{.INPUTS}}' '{{.OUT}}' '{{.MODE}}'

  diagnostic:expired-review-preserve:
    desc: Inventory prior evidence around expired request controls
    dir: experiments/exec-reliability
    requires:
      vars: [MODE]
    cmds:
      - uv run --locked python evidence/expired-request-review-k142/preserve.py '{{.MODE}}'

  diagnostic:expired-review-audit-controls:
    desc: Check missing and invalid expired request audit journals
    dir: experiments/exec-reliability
    cmds:
      - uv run --locked python -m pytest -q evidence/expired-request-review-k142/test_audit.py

  diagnostic:expired-review-verify:
    desc: Verify retained expired request results and artifact digests; fresh OUT
    dir: experiments/exec-reliability
    requires:
      vars: [OUT]
    cmds:
      - uv run --locked python evidence/expired-request-review-k142/verify.py '{{.OUT}}'

  diagnostic:expired-request-prepare:
    desc: Freeze expired request controls and named ownership regressions
    dir: experiments/exec-reliability
    requires:
      vars: [INPUTS, OUT]
    cmds:
      - uv run --locked python evidence/expired-request-controls-k137/prepare.py '{{.INPUTS}}' '{{.OUT}}' {{if .MUTANT}}--mutant '{{.MUTANT}}'{{end}}

  diagnostic:expired-request-check:
    desc: Retain bounded frozen expired request controls, suites and statics
    dir: experiments/exec-reliability
    requires:
      vars: [INPUTS, OUT, MODE]
    cmds:
      - uv run --locked {{if .PYTHON}}--isolated --python '{{.PYTHON}}'{{end}} python evidence/expired-request-controls-k137/run_condition.py '{{.INPUTS}}' '{{.OUT}}' '{{.MODE}}'

  diagnostic:expired-request-preserve:
    desc: Inventory prior evidence around expired request controls
    dir: experiments/exec-reliability
    requires:
      vars: [MODE]
    cmds:
      - uv run --locked python evidence/expired-request-controls-k137/preserve.py '{{.MODE}}'

  diagnostic:startup-frames-probe:
    desc: Retain the interpreter decoder depth probe
    dir: experiments/exec-reliability
    requires:
      vars: [OUT]
    cmds:
      - /bin/sh -C -c 'exec uv run --locked python evidence/startup-frame-controls-k139/probe_decoder.py > "$1"' sh '{{.OUT}}'

  diagnostic:startup-frames-prepare:
    desc: Freeze startup readiness inputs with optional parent source overrides
    dir: experiments/exec-reliability
    requires:
      vars: [INPUTS, OUT]
    cmds:
      - uv run --locked python evidence/startup-frame-controls-k139/prepare.py '{{.INPUTS}}' '{{.OUT}}' {{if .MUTANT}}--mutant '{{.MUTANT}}'{{end}} {{if .WORKER_SOURCE}}--worker-source '{{.WORKER_SOURCE}}'{{end}} {{if .TURNS_SOURCE}}--turns-source '{{.TURNS_SOURCE}}'{{end}} {{if .TESTS_SOURCE}}--tests-source '{{.TESTS_SOURCE}}'{{end}}

  diagnostic:startup-frames-check:
    desc: Retain bounded startup readiness controls, suites and statics
    dir: experiments/exec-reliability
    requires:
      vars: [INPUTS, OUT, MODE]
    cmds:
      - uv run --locked python evidence/startup-frame-controls-k139/run_condition.py '{{.INPUTS}}' '{{.OUT}}' '{{.MODE}}' --select '{{.SELECT | default ""}}'

  diagnostic:startup-frames-preserve:
    desc: Inventory prior evidence around startup readiness work
    dir: experiments/exec-reliability
    requires:
      vars: [MODE]
    cmds:
      - uv run --locked python evidence/startup-frame-controls-k139/preserve.py '{{.MODE}}'

  diagnostic:startup-frames-tools:
    desc: Format, lint and typecheck startup readiness evidence tools
    dir: experiments/exec-reliability
    cmds:
      - uv run --locked python -m ruff format {{.CLI_ARGS}} evidence/startup-frame-controls-k139/*.py
      - uv run --locked python -m ruff check evidence/startup-frame-controls-k139/*.py
      - uv run --locked python -m pyright evidence/startup-frame-controls-k139/*.py

  diagnostic:startup-frames-audit:
    desc: Verify retained startup readiness evidence and per-case comparisons
    dir: experiments/exec-reliability
    cmds:
      - uv run --locked python evidence/startup-frame-controls-k139/audit.py

  diagnostic:startup-turns-prepare:
    desc: Freeze startup readiness inputs with optional parent source overrides
    dir: experiments/exec-reliability
    requires:
      vars: [INPUTS, OUT]
    cmds:
      - uv run --locked python evidence/startup-turns-k134/prepare.py '{{.INPUTS}}' '{{.OUT}}' {{if .MUTANT}}--mutant '{{.MUTANT}}'{{end}} {{if .WORKER_SOURCE}}--worker-source '{{.WORKER_SOURCE}}'{{end}} {{if .TURNS_SOURCE}}--turns-source '{{.TURNS_SOURCE}}'{{end}} {{if .TESTS_SOURCE}}--tests-source '{{.TESTS_SOURCE}}'{{end}}

  diagnostic:startup-turns-check:
    desc: Retain bounded startup readiness controls, suites and statics
    dir: experiments/exec-reliability
    requires:
      vars: [INPUTS, OUT, MODE]
    cmds:
      - uv run --locked python evidence/startup-turns-k134/run_condition.py '{{.INPUTS}}' '{{.OUT}}' '{{.MODE}}' --select '{{.SELECT | default ""}}'

  diagnostic:startup-turns-preserve:
    desc: Inventory prior evidence around startup readiness work
    dir: experiments/exec-reliability
    requires:
      vars: [MODE]
    cmds:
      - uv run --locked python evidence/startup-turns-k134/preserve.py '{{.MODE}}'

  diagnostic:startup-turns-tools:
    desc: Format, lint and typecheck startup readiness evidence tools
    dir: experiments/exec-reliability
    cmds:
      - uv run --locked python -m ruff format {{.CLI_ARGS}} evidence/startup-turns-k134/*.py
      - uv run --locked python -m ruff check evidence/startup-turns-k134/*.py
      - uv run --locked python -m pyright evidence/startup-turns-k134/*.py

  diagnostic:startup-turns-audit:
    desc: Verify retained startup readiness evidence and per-case comparisons
    dir: experiments/exec-reliability
    cmds:
      - uv run --locked python evidence/startup-turns-k134/audit.py

  diagnostic:readiness-review-prepare:
    desc: Freeze pipe readiness inputs with optional parent source overrides
    dir: experiments/exec-reliability
    requires:
      vars: [INPUTS, OUT]

# Reusable development tasks for TestAnyware. Local only: releases and live checks
# run on an arm64 Mac, and CI is deliberately not used. Run `task --list`.
#
# Grown from need: the Rust CLI's test/lint loop, the live `vm start` checks, the
# macOS agent, the golden builds and thin wrappers over scripts/release-*.sh.
version: '3'

vars:
  CLI_DIR: '{{.ROOT_DIR}}/cli-rs'
  BIN: '{{.ROOT_DIR}}/cli-rs/target/debug/testanyware'

tasks:
  diagnostic:failure-preserve:
    desc: Snapshot or compare all earlier evidence before and after the k149 controls
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [MODE]
    cmds:
      - uv run --locked python evidence/failure-controls-k149/preserve.py {{.MODE | shellQuote}}

  diagnostic:setuid-kill:
    desc: Retain actual setuid-ps KILL controls through the real helper engine
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python evidence/failure-controls-k149/setuid_ps_kill.py {{.OUT | shellQuote}} --trials {{.TRIALS | default "5"}} {{if .MUTANT}}--mutant {{.MUTANT | shellQuote}}{{end}}

  diagnostic:scope-readiness:
    desc: Reproduce the k145 interrupted live-group shape with declared child readiness
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [INPUTS, OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python evidence/failure-controls-k149/scope_readiness.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} --repeat {{.REPEAT | default "3"}}

  diagnostic:scope-readiness-k151:
    desc: Rerun the k145 readiness control with the k151 child audit (absent, present or unknown)
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [INPUTS, OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python evidence/failure-controls-k151/scope_readiness.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} --repeat {{.REPEAT | default "3"}}

  diagnostic:absence-controls:
    desc: Show that the k149 absence predicate fails and the k151 verdict passes on real ps results
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python evidence/failure-controls-k151/absence_controls.py {{.OUT | shellQuote}}

  diagnostic:admission-timing:
    desc: Separate reap cutoff admission from syscall execution for one input set
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [INPUTS, OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python evidence/failure-controls-k149/admission_timing.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} --repeat {{.REPEAT | default "5"}}

  diagnostic:failure-prepare:
    desc: Freeze one k149 input set with an optional declared mutation
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [SOURCE, DEST]
    cmds:
      - uv run --locked python evidence/failure-controls-k149/prepare.py {{.SOURCE | shellQuote}} {{.DEST | shellQuote}} {{if .MUTANT}}--mutant {{.MUTANT | shellQuote}}{{end}}

  diagnostic:storage-controls:
    desc: Run only the evidence-storage controls, the nine required controls and the review controls
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    cmds:
      - uv run --locked python -m pytest -p no:cacheprovider -rxXs test_storage_controls.py

  diagnostic:failure-timing-tests:
    desc: Run the repaired cutoff timing tests in one frozen input set with retained receipts
    dir: '{{.INPUTS}}'
    requires:
      vars: [INPUTS, OUT]
    env:
      DIAGNOSTIC_EVIDENCE: '{{.OUT}}/receipts'
    cmds:
      - mkdir -p {{.OUT | shellQuote}}
      - uv run --locked --isolated --python 3.12 python -m pytest -vv -p no:cacheprovider --junitxml={{.OUT | shellQuote}}/pytest.xml test_worker_capture.py::test_worker_shutdown_deadline_closes_owner_operations test_shutdown.py::test_declared_shutdown_real_child_phases

  diagnostic:late-identity-tests:
    desc: Run the late-created identity fixture tests in one frozen input set with retained receipts
    dir: '{{.INPUTS}}'
    requires:
      vars: [INPUTS, OUT]
    env:
      DIAGNOSTIC_EVIDENCE: '{{.OUT}}/receipts'
    cmds:
      - mkdir -p {{.OUT | shellQuote}}
      - uv run --locked --isolated --python 3.12 python -m pytest -vv -p no:cacheprovider --junitxml={{.OUT | shellQuote}}/pytest.xml test_worker_capture.py -k late_created_identity

  diagnostic:failure-full-suite:
    desc: Run the full exec-reliability suite in one frozen k149 input set with retained receipts
    dir: '{{.INPUTS}}'
    requires:
      vars: [INPUTS, OUT]
    env:
      DIAGNOSTIC_EVIDENCE: '{{.OUT}}/receipts'
    cmds:
      - mkdir -p {{.OUT | shellQuote}}
      - uv run --locked --isolated --python 3.12 python -m pytest -q -p no:cacheprovider --junitxml={{.OUT | shellQuote}}/pytest.xml

  diagnostic:eof-order-tests:
    desc: Run the fork-failure EOF-order controls in one frozen input set with retained receipts
    dir: '{{.INPUTS}}'
    requires:
      vars: [INPUTS, OUT]
    env:
      DIAGNOSTIC_EVIDENCE: '{{.OUT}}/receipts'
    cmds:
      - mkdir -p {{.OUT | shellQuote}}
      - uv run --locked --isolated --python 3.12 python -m pytest -vv -p no:cacheprovider --junitxml={{.OUT | shellQuote}}/pytest.xml test_worker_capture.py -k "fork_failure_lost_result_eof_order or (worker_fork_failure_evidence and lost-result)"

  diagnostic:foreign-denial:
    desc: Drive real controller termination against a separately owned foreign-UID fixture (pass SELF=1 for the owned plumbing check)
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [INPUTS, OUT]
    vars:
      OWNER: '{{.OWNER | default ""}}'
      SELF: '{{.SELF | default ""}}'
    cmds:
      - uv run --locked --isolated --python 3.12 python -I evidence/failure-controls-k149/foreign_denial.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} {{if .SELF}}--self-fixture{{else}}--owner-dir {{.OWNER | shellQuote}}{{end}}

  diagnostic:scope-parent-tests:
    desc: Run the scope-parent group tests in one frozen input set with retained receipts
    dir: '{{.INPUTS}}'
    requires:
      vars: [INPUTS, OUT]
    env:
      DIAGNOSTIC_EVIDENCE: '{{.OUT}}/receipts'
    cmds:
      - mkdir -p {{.OUT | shellQuote}}
      - uv run --locked --isolated --python 3.12 python -m pytest -vv -p no:cacheprovider --junitxml={{.OUT | shellQuote}}/pytest.xml test_controller.py -k "exited_leader_does_not_hide or live_group_is_failure_even"

  diagnostic:ps-latency:
    desc: Measure real ps latency idle, under CPU load and against exiting processes
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python -I evidence/failure-controls-k149/ps_latency.py {{.OUT | shellQuote}}

  diagnostic:exiting-leader:
    desc: Run real slow-exiting group leaders through one frozen controller input set
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [INPUTS, OUT]
    vars:
      REPEAT: '{{.REPEAT | default "10"}}'
    cmds:
      - uv run --locked --isolated --python 3.12 python -I evidence/failure-controls-k149/exiting_leader.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} --repeat {{.REPEAT}}

  diagnostic:exit-latency:
    desc: Measure scope-parent leader exit latency after group TERM for one input set
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [INPUTS, OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python evidence/failure-controls-k149/exit_latency.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} --repeat {{.REPEAT | default "20"}} --load {{.LOAD | default "0"}}

  diagnostic:failure-tools:
    desc: Check k149 and k151 failure-control evidence tooling
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    cmds:
      - uv run --locked python -m ruff check evidence/failure-controls-k149/*.py
      - uv run --locked python -m ruff format --check evidence/failure-controls-k149/*.py
      - uv run --locked python -m pyright evidence/failure-controls-k149/*.py
      - uv run --locked python -m ruff check evidence/failure-controls-k151/*.py
      - uv run --locked python -m ruff format --check evidence/failure-controls-k151/*.py
      - uv run --locked python -m pyright evidence/failure-controls-k151/*.py

  diagnostic:deadline-stall:
    desc: Run the k154 worker-deadline control in frozen INPUTS, into a new OUT directory (STALL=1 delays the first runtime signal to the deadline, SURVEY=1 records non-failing tests as notes)
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [INPUTS, OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python -I evidence/worker-deadline-cleanup-k154/stall_control.py {{.INPUTS | shellQuote}} {{.OUT | shellQuote}} {{if .STALL}}--stall{{end}} {{if .SURVEY}}--survey{{end}} {{range $t := splitList "," (.TESTS | default "")}}{{if $t}}--test {{$t | shellQuote}} {{end}}{{end}}

  diagnostic:macos-completion-retained:
    desc: Compare the retained issue #14 macOS evidence with the k3 manifest (MODE=snapshot writes it once)
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    cmds:
      - uv run --locked --isolated --python 3.12 python -I evidence/macos-completion-k3/retained.py {{.MODE | default "compare" | shellQuote}}

  diagnostic:macos-completion-old-path:
    desc: 'Build the unchanged agent ProcessRunner into the k3 probe and run its frozen GCD-starvation plan into a new OUT directory. Known defect: exits 0 when the verdict equals EXPECT (default defect). VARIANT=single-hop builds the detector control, which is not a repair'
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python -I evidence/macos-completion-k3/old_path.py {{.OUT | shellQuote}} --variant {{.VARIANT | default "old" | shellQuote}} --expect {{.EXPECT | default "defect" | shellQuote}} --trial-bound-seconds {{.TRIAL_BOUND | default "20" | shellQuote}}

  diagnostic:macos-completion-tools:
    desc: Check the k3 macOS completion tooling
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    cmds:
      - uv run --locked python -m ruff check evidence/macos-completion-k3/*.py
      - uv run --locked python -m ruff format --check evidence/macos-completion-k3/*.py
      - uv run --locked python -m pyright evidence/macos-completion-k3/*.py

  diagnostic:macos-completion-live:
    desc: 'Boot one owned clone of testanyware-golden-macos-27 and run the frozen k186 plan into a new OUT directory: ten serial exact `printf ordinary-ok` requests, three rounds of four concurrent requests and a guest pool read. The controller disposes the clone. OUT-outer keeps the inventories, the app pid, the source and host identities and the receipt check'
    requires:
      vars: [OUT]
    cmds:
      - experiments/exec-reliability/completion_k186_run.sh {{.OUT | shellQuote}}

  diagnostic:macos-completion-live-check:
    desc: Judge one retained k186 controller run directory RUN, relative to the repository root, against the frozen shape and its host evidence. Exit 0 only for verdict pass
    requires:
      vars: [RUN]
    cmds:
      - uv run --project experiments/exec-reliability --locked python -I experiments/exec-reliability/completion_k186_check.py {{.RUN | shellQuote}}

  diagnostic:macos-completion-live-tools:
    desc: Check the k186 live completion tooling and run its controls, which need no VM
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    cmds:
      - uv run --locked python -m ruff check completion_k186.py completion_k186_check.py concurrent_k186.py test_completion_k186.py
      - uv run --locked python -m ruff format --check completion_k186.py completion_k186_check.py concurrent_k186.py test_completion_k186.py
      - uv run --locked python -m pyright completion_k186.py completion_k186_check.py concurrent_k186.py test_completion_k186.py
      - shellcheck completion_k186_run.sh
      - uv run --locked python -m pytest -q -p no:cacheprovider test_completion_k186.py

  diagnostic:macos-timeout-inspection:
    desc: 'Boot one owned clone of testanyware-golden-macos-27 and run the frozen k4 plan into a new OUT directory: the exact issue #14 `sleep 120` and fork/wait payloads with guest timeout 2 s, the known-child `ps` observation, ten after-timeout operations, then the complete original r3 VM-fit sequence. The controller cleans up the known children and disposes the clone. OUT-outer keeps the inventories, the identities and the receipt check'
    requires:
      vars: [OUT]
    cmds:
      - experiments/exec-reliability/timeout_k4_run.sh {{.OUT | shellQuote}}

  diagnostic:macos-timeout-inspection-check:
    desc: 'Judge one retained k4 controller run directory RUN, relative to the repository root. Report the evidence (complete, incomplete or absent) and the post-timeout stall (reproduced, not-reproduced or unknown). Exit 0 only when the stall result is determined and the clone was disposed'
    requires:
      vars: [RUN]
    cmds:
      - uv run --project experiments/exec-reliability --locked python experiments/exec-reliability/timeout_k4_check.py {{.RUN | shellQuote}}

  diagnostic:macos-timeout-inspection-tools:
    desc: Check the k4 post-timeout inspection tooling and run its controls, which need no VM
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    cmds:
      - uv run --locked python -m ruff check timeout_k4.py timeout_k4_check.py test_timeout_k4.py
      - uv run --locked python -m ruff format --check timeout_k4.py timeout_k4_check.py test_timeout_k4.py
      - uv run --locked python -m pyright timeout_k4.py timeout_k4_check.py test_timeout_k4.py
      - shellcheck timeout_k4_run.sh
      - uv run --locked python -m pytest -q -p no:cacheprovider test_timeout_k4.py

  diagnostic:macos-timeout-inspection-r3:
    desc: Run the original r3 fixture condition alone once on one fresh macOS clone (k193)
    requires:
      vars: [OUT]
    cmds:
      - experiments/exec-reliability/timeout_k193_run.sh {{.OUT | shellQuote}}

  diagnostic:macos-timeout-inspection-r3-check:
    desc: Judge one run of the k193 r3-only condition with checker revision 3
    requires:
      vars: [RUN]
    cmds:
      - uv run --project experiments/exec-reliability --locked python experiments/exec-reliability/timeout_k193_check.py {{.RUN | shellQuote}}

  diagnostic:macos-timeout-inspection-r3-tools:
    desc: Check the k193 r3-only tooling and run its controls and the k4 controls, which need no VM
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    cmds:
      - uv run --locked python -m ruff check timeout_k193.py timeout_k193_check.py test_timeout_k193.py
      - uv run --locked python -m ruff format --check timeout_k193.py timeout_k193_check.py test_timeout_k193.py
      - uv run --locked python -m pyright timeout_k193.py timeout_k193_check.py test_timeout_k193.py
      - shellcheck timeout_k193_run.sh
      - uv run --locked python -m pytest -q -p no:cacheprovider test_timeout_k193.py test_timeout_k4.py

  diagnostic:macos-disconnect-availability-host:
    desc: Run the k13 HTTP and client disconnect controls once on a loopback copy of the checkout agent, which needs no VM
    deps: [cli:build, app:build]
    requires:
      vars: [OUT]
    cmds:
      - experiments/exec-reliability/disconnect_k13_run.sh host {{.OUT | shellQuote}}

  diagnostic:macos-disconnect-availability:
    desc: Run the k13 control, concurrent and term modes once on one fresh unchanged macOS clone
    requires:
      vars: [OUT]
    cmds:
      - experiments/exec-reliability/disconnect_k13_run.sh live {{.OUT | shellQuote}}

  diagnostic:macos-disconnect-availability-check:
    desc: Judge one k13 run again. MODE is host or live, and OUT is the run directory
    requires:
      vars: [MODE, OUT]
    cmds:
      - uv run --project experiments/exec-reliability --locked python experiments/exec-reliability/disconnect_k13_check.py {{.MODE | shellQuote}} {{.OUT | shellQuote}}

  diagnostic:macos-disconnect-availability-tools:
    desc: Check the k13 tooling and run its controls, which need no VM
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    cmds:
      - uv run --locked python -m ruff check disconnect_k13.py disconnect_k13_burst.py disconnect_k13_host.py disconnect_k13_seam.py disconnect_k13_check.py test_disconnect_k13.py
      - uv run --locked python -m ruff format --check disconnect_k13.py disconnect_k13_burst.py disconnect_k13_host.py disconnect_k13_seam.py disconnect_k13_check.py test_disconnect_k13.py
      - uv run --locked python -m pyright disconnect_k13.py disconnect_k13_burst.py disconnect_k13_host.py disconnect_k13_seam.py disconnect_k13_check.py test_disconnect_k13.py
      - shellcheck disconnect_k13_run.sh
      - uv run --locked python -m pytest -q -p no:cacheprovider test_disconnect_k13.py

  diagnostic:macos-process-fixtures:
    desc: 'Run the macOS agent suite beside an unrelated `sleep 300` control into a new OUT directory. ARM=owned (default) expects the control to survive. ARM=broad restores the pre-k185 broad cleanup in a temporary copy and expects the control to be killed. The broad cleanup signals every matching process of this user, so ARM=broad also needs ISOLATED_HOST=1, which declares a host where no other process of this user can match. It still refuses to run while it sees such a process'
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python -I evidence/macos-process-fixtures-k185/fixtures.py {{.OUT | shellQuote}} --arm {{.ARM | default "owned" | shellQuote}} --expect {{.EXPECT | default (eq (.ARM | default "owned") "broad" | ternary "killed" "survives") | shellQuote}} --runs {{.RUNS | default "3" | shellQuote}} --baseline-rev {{.BASELINE_REV | default "990641750f0735fcb400e93fcc0974800f26f28b" | shellQuote}}{{if .ISOLATED_HOST}} --isolated-host{{end}}

  diagnostic:macos-process-fixtures-tools:
    desc: Check the k185 process-fixture control tooling
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    cmds:
      - uv run --locked python -m ruff check evidence/macos-process-fixtures-k185/*.py
      - uv run --locked python -m ruff format --check evidence/macos-process-fixtures-k185/*.py
      - uv run --locked python -m pyright evidence/macos-process-fixtures-k185/*.py

  diagnostic:macos-exit-observation-controls:
    desc: 'Build the macOS agent with the k195 exit trace and run its four ordering controls RUNS times (default 3) into a new OUT directory. Also checks that the default release agent holds no trace symbol'
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [OUT]
    cmds:
      - uv run --locked --isolated --python 3.12 python -I evidence/macos-exit-observation-k195/controls.py {{.OUT | shellQuote}} --runs {{.RUNS | default "3" | shellQuote}}

  diagnostic:macos-exit-observation:
    desc: 'Run the k195 traced workload once on one owned macOS clone into a new OUT directory. Needs the owner''s app handover first: the development app answers and the installed app does not run. Builds the traced agent, installs it in the clone, runs the k4 run 02 workload, downloads the guest exit trace and disposes the clone'
    deps: [cli:build]
    requires:
      vars: [OUT]
    cmds:
      - sh experiments/exec-reliability/exit_k195_run.sh {{.OUT | shellQuote}}

  diagnostic:macos-exit-observation-check:
    desc: Judge one k195 traced run directory RUN (OUT/<run_id>) and print the result
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [RUN]
    cmds:
      - uv run --locked python exit_k195_check.py {{.RUN | shellQuote}}

  diagnostic:macos-exit-observation-tools:
    desc: Check the k195 exit-observation control and guest tooling
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    cmds:
      - uv run --locked python -m ruff check evidence/macos-exit-observation-k195/*.py exit_k195.py exit_k195_check.py test_exit_k195.py
      - uv run --locked python -m ruff format --check evidence/macos-exit-observation-k195/*.py exit_k195.py exit_k195_check.py test_exit_k195.py
      - uv run --locked python -m pyright evidence/macos-exit-observation-k195/*.py exit_k195.py exit_k195_check.py test_exit_k195.py
      - shellcheck exit_k195_run.sh
      - uv run --locked python -m pytest -q -p no:cacheprovider test_exit_k195.py

  diagnostic:macos-exec-outcomes:
    desc: 'Run the k12 exec outcome matrix once on the host into a new OUT directory. Builds the unchanged and the traced runner probes and a loopback copy of the agent, then runs eight cases through the reference, process, traced, HTTP, CLI text and CLI JSON seams. Uses no clone and no default socket'
    deps: [cli:build, app:build]
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [OUT]
    cmds:
      - uv run --locked python outcomes_k12.py {{.OUT | shellQuote}}

  diagnostic:macos-exec-outcomes-check:
    desc: Judge one k12 OUT directory. Fails on unsound evidence, not on the defects of the old path
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [OUT]
    cmds:
      - uv run --locked python outcomes_k12_check.py {{.OUT | shellQuote}}

  diagnostic:macos-exec-outcomes-old-path:
    desc: Detect the old exec path in one k12 OUT directory. Passes only when the sound evidence shows every frozen defect, so a fixed runner makes it fail
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [OUT]
    cmds:
      - uv run --locked python outcomes_k12_check.py {{.OUT | shellQuote}} --expect-defects

  diagnostic:macos-exec-outcomes-record:
    desc: Judge the typed exec records of one k12 OUT directory at the HTTP and Host CLI JSON seams. Passes only when the evidence is sound and every case is faithful, so an agent without the record makes it fail
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [OUT]
    cmds:
      - uv run --locked python outcomes_k12_check.py {{.OUT | shellQuote}} --expect-record

  diagnostic:macos-exec-outcomes-tools:
    desc: Check the k12 exec outcome runner, seams, checker and probe
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    cmds:
      - uv run --locked python -m ruff check outcomes_k12.py outcomes_k12_seam.py outcomes_k12_check.py test_outcomes_k12.py
      - uv run --locked python -m ruff format --check outcomes_k12.py outcomes_k12_seam.py outcomes_k12_check.py test_outcomes_k12.py
      - uv run --locked python -m pyright outcomes_k12.py outcomes_k12_seam.py outcomes_k12_check.py test_outcomes_k12.py
      - uv run --locked python -m pytest -q -p no:cacheprovider test_outcomes_k12.py

  diagnostic:linux-timeout-lifecycle:
    desc: 'Run the k5 Linux exec outcome and timeout lifecycle matrix once into a new OUT directory. Runs the unchanged Linux agent in fresh containers of one pinned image, through the reference, process, traced, HTTP, CLI text and CLI JSON seams. Uses no clone, no VM and no default socket'
    deps: [cli:build, app:build]
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [OUT]
    cmds:
      - uv run --locked python linux_k5.py {{.OUT | shellQuote}}

  diagnostic:linux-timeout-lifecycle-check:
    desc: Judge one k5 OUT directory. Fails on unsound evidence, not on the defects of the old path
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [OUT]
    cmds:
      - uv run --locked python linux_k5_check.py {{.OUT | shellQuote}}

  diagnostic:linux-timeout-lifecycle-old-path:
    desc: Detect the old Linux exec path in one k5 OUT directory. Passes only when the sound evidence shows every frozen defect, so a fixed agent makes it fail
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    requires:
      vars: [OUT]
    cmds:
      - uv run --locked python linux_k5_check.py {{.OUT | shellQuote}} --expect-defects

  diagnostic:linux-timeout-lifecycle-tools:
    desc: Check the k5 Linux timeout lifecycle runner, seams, checker and stubs
    dir: '{{.ROOT_DIR}}/experiments/exec-reliability'
    cmds:
      - uv run --locked python -m ruff check linux_k5.py linux_k5_seam.py linux_k5_check.py test_linux_k5.py linux_k5_stub
      - uv run --locked python -m ruff format --check linux_k5.py linux_k5_seam.py linux_k5_check.py test_linux_k5.py linux_k5_stub
      - uv run --locked python -m pyright linux_k5.py linux_k5_seam.py linux_k5_check.py test_linux_k5.py
      - uv run --locked python -m pytest -q -p no:cacheprovider test_linux_k5.py

  diagnostic:linux-timeout-live:

# Reusable development tasks for TestAnyware. Local only: releases and live checks
# run on an arm64 Mac, and CI is deliberately not used. Run `task --list`.
#
# Grown from need: the Rust CLI's test/lint loop, the live `vm start` checks, the
# macOS agent, the golden builds and thin wrappers over scripts/release-*.sh.
version: '3'

vars:
  CLI_DIR: '{{.ROOT_DIR}}/cli-rs'
  BIN: '{{.ROOT_DIR}}/cli-rs/target/debug/testanyware'

tasks:
  default:
    desc: List the available tasks
    silent: true
    cmds:
      - task --list

  # ---- Rust CLI ------------------------------------------------------------

  cli:build:
    desc: Build the debug host CLI that the live checks drive
    dir: '{{.CLI_DIR}}'
    cmds:
      - cargo build -p testanyware-cli

  app:build:
    desc: Build the debug TestAnyware app executable that the live checks run in test mode
    dir: '{{.CLI_DIR}}'
    cmds:
      - cargo build -p testanyware-app

  cli:test:
    desc: Run the whole cli-rs test suite (live-VM tests stay ignored)
    dir: '{{.CLI_DIR}}'
    cmds:
      - cargo test --workspace

  app:test:
    desc: Test the TestAnyware app, its protocol crate and its client crate. The tests run the real app executable in test mode (macOS or Linux host)
    dir: '{{.CLI_DIR}}'
    cmds:
      - cargo test -p testanyware-app-protocol -p testanyware-app -p testanyware-app-client

  app:routing-test:
    desc: Run the real host CLI binary against the real app executable and fake guests (agent, VNC) and a fake tart (vm list, vm start, vm stop and vm delete), and an app that forges its build, range and bundle build, so that each row of the version skew table is a run. Uses the default socket on a macOS host and TESTANYWARE_APP_SOCKET elsewhere (macOS or Linux host)
    dir: '{{.CLI_DIR}}'
    cmds:
      - cargo test -p testanyware-cli --test app-agent-routing --test app-vnc-routing --test app-vm-list-routing --test app-vm-start-routing --test app-vm-stop-delete-routing --test app-version-skew

  config:test:
    desc: Test config.rhai (ADR-0021). The evaluator and its limits, the order of the sources, the doctor `config` check, and the real CLI binary against a file that fails. On a macOS host the real CLI and the real app executable read one file, and golden creation compares its directories with the app's (golden-directory-check). The app side runs the real app executable with a file that evaluates and one that fails, the directory refusal and its remedy, a restart that reloads the file, and the tool locations (macOS host)
    dir: '{{.CLI_DIR}}'
    cmds:
      - cargo test -p testanyware-config
      - 'cargo test -p testanyware-vm --lib -- paths:: tools::'
      - cargo test -p testanyware-vm --test configured_tools
      - cargo test -p testanyware-app-protocol config_invalid
      - 'cargo test -p testanyware-cli --lib -- host_config:: doctor:: resolve::'
      - cargo test -p testanyware-cli --test config-file --test golden-directory-check
      - 'cargo test -p testanyware-app --lib -- config:: menu::'
      - cargo test -p testanyware-app --test configuration

  doctor:app-test:
    desc: Test the `app` check of `doctor` (spec "What the commands report about the app"). The classifier of every item, the report against doctor.json, the status fields of the app (Local Network observation, login item, executable), and the real CLI binary against the real app executable with a directory mismatch, a protocol mismatch, a bundle newer than the app, a file that fails and an app that does not run (macOS host). A Linux or Windows host runs the not-applicable case
    dir: '{{.CLI_DIR}}'
    cmds:
      - 'cargo test -p testanyware-app-protocol --lib -- status:: bundle::'
      - 'cargo test -p testanyware-app --lib -- grant:: menu:: bundle::'
      - 'cargo test -p testanyware-cli --lib -- doctor_app::'
      - cargo test -p testanyware-cli --test doctor-app

  app:bundle-dev:
    desc: Build and sign the development bundle of the TestAnyware app, bundle id dev.antony.TestAnyware.dev (macOS host). Prints its path. The signing identity is the Developer ID of team TA43A4RUP3, and any other team is refused
    cmds:
      - scripts/build-app.sh dev

  app:bundle-live:
    desc: Live check on this Mac. Open the development bundle through LaunchServices, read GET /v1/status on the app socket, check that golden creation expects the directories that the app holds, check the login item, the executable and the Local Network observation that the real app reports and that `doctor` reports them, read the status item's menu, and quit it. Then open it again with a config.rhai that fails (TESTANYWARE_CONFIG) and check the status and the menu. Needs no guest and uses the real app socket, so quit a running app first
    deps: [cli:build]
    cmds:
      - scripts/app-bundle-live.sh

  app:routing-live:
    desc: 'Live check on this Mac, from a herdr session: with no variable set, agent snapshot, screen capture, input move and a file transfer reach a running guest through the app, and the CLI has no direct path (task app:routing-live VM=<id>). A person first starts the guest in Terminal (testanyware vm start --platform macos --id <id>) and allows the Local Network alert once. Starts the development bundle when no app answers, and quits only that one'
    deps: [cli:build]
    preconditions:
      - sh: test -n "{{.VM}}"
        msg: 'name the guest that a person started in Terminal: task app:routing-live VM=<id>'
    cmds:
      - TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/app-routing-live.sh {{.VM | shellQuote}}

  app:herdr-acceptance:
    desc: 'The herdr acceptance run on this Mac, from a herdr session: with no variable set, vm start --platform macos, an agent, a screen, an input and a file command, and vm stop all go through the app, and each fails with APP_UNREACHABLE when no app answers. Prints PASS or FAIL. APP defaults to the development bundle, and the release candidate passes its own bundle (task app:herdr-acceptance APP=<bundle>). A person first allows the Local Network alert for the app, once. Starts the bundle when no app answers, quits only that one, and stops its guest on every exit. About two minutes, one free macOS guest slot'
    deps: [cli:build]
    cmds:
      - |
        app={{.APP | default "" | shellQuote}}
        [ -n "$app" ] || app=$(scripts/build-app.sh dev | tail -n 1)
        TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/herdr-acceptance-live.sh "$app"

  app:adoption-live:
    desc: 'Live check on this Mac: VMs outlive the app, and the app adopts them. Starts a macOS guest through the app, quits the app and shows the guest runs on with the same processes, opens the app and shows it adopts the guest, and an agent and a screen command reach it. Then it removes the identity from the meta (a hand-made older meta) and shows the app adopts the guest as legacy and stops it by name. When an older Host CLI is at hand (OLD_TESTANYWARE_BIN, or the testanyware on PATH), it repeats the legacy case with a guest that CLI started. APP defaults to the development bundle (task app:adoption-live APP=<bundle>). A person first allows the Local Network alert for the app, once. Quits only the app it started, and stops its guests on every exit. About five minutes, one free macOS guest slot'
    deps: [cli:build]
    cmds:
      - |
        app={{.APP | default "" | shellQuote}}
        [ -n "$app" ] || app=$(scripts/build-app.sh dev | tail -n 1)
        TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/app-adoption-live.sh "$app"

  cli:clippy:
    desc: Lint cli-rs (clippy has pre-existing warnings in testanyware-rfb and two large-Err sites, so this reports and never gates)
    dir: '{{.CLI_DIR}}'
    cmds:
      - cargo clippy --workspace --all-targets

  cli:fmt:
    desc: 'Check rustfmt on given files (task cli:fmt -- <files>); add FIX=1 to rewrite them. Never repo-wide: the repo has pre-existing drift'
    dir: '{{.CLI_DIR}}'
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: 'name the files to check: task cli:fmt -- crates/testanyware-vm/src/start_outcome.rs'
    cmds:
      - rustfmt --edition 2021 {{if .FIX}}{{else}}--check{{end}} {{.CLI_ARGS}}

  # ---- macOS In-VM agent ---------------------------------------------------

  agent:macos:test:
    desc: Build the macOS In-VM agent and run its Swift tests (host-side; mock elements, no guest)
    dir: '{{.ROOT_DIR}}/agents/macos'
    cmds:
      - swift build
      - swift test

  agent:macos:build:
    desc: Build the release macOS In-VM agent at agents/macos/.build/release/testanyware-agent (what a golden build installs when TESTANYWARE_AGENT_BIN_OVERRIDE names it)
    dir: '{{.ROOT_DIR}}/agents/macos'
    cmds:
      - swift build -c release

  scripts:check:
    desc: shellcheck and shfmt (-i 2 -ci) over the scripts the tasks here run
    vars:
      SCRIPTS: scripts/live-start-checks.sh scripts/qemu-tpm-check.sh scripts/windows-healthy-start.sh scripts/vnc-keeper-live.sh scripts/build-app.sh scripts/app-bundle-live.sh scripts/app-routing-live.sh scripts/herdr-acceptance-live.sh scripts/app-adoption-live.sh
    cmds:
      - shellcheck -x {{.SCRIPTS}}
      - shfmt -i 2 -ci -d {{.SCRIPTS}}

  # ---- Live checks (macOS host) --------------------------------------------

  vm:slot-exhaustion:
    desc: With both macOS guest slots taken, a third start fails fast with VM_LIMIT_REACHED (exit 6) and leaves no clone
    deps: [cli:build]
    cmds:
      - TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/live-start-checks.sh slot-exhaustion

  vm:slot-wait:
    desc: With both macOS guest slots taken, `vm start --wait` waits, runs out with VM_LIMIT_REACHED, and begins within seconds of a holder stopping (about 4 minutes; needs one free slot, takes the other)
    deps: [cli:build]
    cmds:
      - TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/live-start-checks.sh slot-wait

  vm:keep-on-failure:
    desc: A failed start is torn down by default and kept under --keep-on-failure (about 4 minutes). Runs its own app in test mode, with the agent probes aimed at a port that refuses
    deps: [cli:build, app:build]
    cmds:
      - TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/live-start-checks.sh keep-on-failure

  vm:qemu-death:
    desc: Killing QEMU during a Windows start's agent wait fails at once with QEMU_FAILED and leaves no VM (about a minute; needs qemu, swtpm and the Windows golden)
    deps: [cli:build]
    cmds:
      - TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/live-start-checks.sh qemu-death

  vm:qemu-start:
    desc: qemu-death, then a Windows (QEMU) start that must reach a Healthy agent (minutes)
    deps: [cli:build]
    cmds:
      - TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/live-start-checks.sh qemu-start

  vm:local-network:
    desc: 'Does a macOS start from this shell reach a Healthy agent, or fail within a minute naming the Local Network denial (cause local_network_denied, ADR-0019)? Needs one free macOS guest slot; stops its VM'
    deps: [cli:build]
    cmds:
      - TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/live-start-checks.sh local-network

  vm:list-custom-id:
    desc: 'A macOS start with an id outside the testanyware- prefix (koine-verify-<n>) is listed by vm list, enriched, and gone after vm stop. Needs one free macOS guest slot'
    deps: [cli:build]
    cmds:
      - TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/live-start-checks.sh list-custom-id

  vm:start-reliability:
    desc: 'N consecutive macOS starts must each reach a Healthy agent (task vm:start-reliability N=10)'
    deps: [cli:build]
    vars:
      RUNS: '{{.N | default "10"}}'
    cmds:
      - TESTANYWARE_BIN={{.BIN | shellQuote}} scripts/live-start-checks.sh reliability {{.RUNS}}

  vm:qemu-tpm-check:
    desc: Does this host's QEMU run a Windows guest's TPM device as TestAnyware attaches it (ADR-0017)? Seconds; paused diskless guests, needs qemu and swtpm
    cmds:
      - scripts/qemu-tpm-check.sh

  vm:start-tpm-report-check:
    desc: Does `vm start --dry-run` report the Windows TPM decision (attached here), and refuse with SWTPM_MISSING when swtpm is hidden? Seconds; no VM is started
    deps: [cli:build]
    vars:
      CLI: '{{.CLI_DIR}}/target/debug/testanyware'
    cmds:
      - '{{.CLI}} vm start --platform windows --dry-run --json | grep -q ''"attached": true'''
      - '{{.CLI}} vm start --platform windows --dry-run 2>&1 | grep -q "TPM attached"'
      # A trimmed PATH cannot hide swtpm: the CLI's `which` always adds
      # /opt/homebrew/bin and /usr/local/bin on macOS. A sandbox denying
      # that one file to the CLI process can. The `ls` is the control: it
      # must fail under the same profile, or the sandbox is hiding nothing.
      - |
        profile='(version 1)(allow default)(deny file-read-metadata file-read-data (literal "/opt/homebrew/bin/swtpm"))'
        if sandbox-exec -p "$profile" /bin/ls /opt/homebrew/bin/swtpm >/dev/null 2>&1; then
          echo "control failed: the sandbox does not hide swtpm" >&2; exit 1
        fi
        out=$(sandbox-exec -p "$profile" {{.CLI}} vm start --platform windows --dry-run --json) && exit 1
        echo "$out" | grep -q '"code": "SWTPM_MISSING"'
        echo "$out" | grep -q 'brew install swtpm'

  doctor:tpm-check:
    desc: Does `doctor` report the Windows TPM decision (attached, PPI off here), and fail with SWTPM_MISSING when swtpm is hidden? Seconds; no VM is started
    deps: [cli:build]
    vars:
      CLI: '{{.CLI_DIR}}/target/debug/testanyware'
    cmds:
      - '{{.CLI}} doctor --json | grep -q ''"attached": true'''
      - '{{.CLI}} doctor | grep -q "Windows guests: TPM attached (PPI off)"'
      # As in vm:start-tpm-report-check: the `ls` is the control and must fail
      # under the sandbox, or the sandbox is hiding nothing. A refused TPM
      # makes doctor exit 1.
      - |
        profile='(version 1)(allow default)(deny file-read-metadata file-read-data (literal "/opt/homebrew/bin/swtpm"))'
        if sandbox-exec -p "$profile" /bin/ls /opt/homebrew/bin/swtpm >/dev/null 2>&1; then
          echo "control failed: the sandbox does not hide swtpm" >&2; exit 1
        fi
        out=$(sandbox-exec -p "$profile" {{.CLI}} doctor --json) && { echo "doctor exited 0 with swtpm hidden" >&2; exit 1; }
        echo "$out" | grep -q '"code": "SWTPM_MISSING"'
        echo "$out" | grep -q 'brew install swtpm'

  vm:windows-healthy-start:
    desc: 'Does one `vm start --platform windows` reach a Healthy agent, unaided, with the TPM attached? Optional BASE=<golden>. About 2.5 minutes (10 to 14 if the agent never answers); always stops and deletes the clone'
    deps: [cli:build]
    cmds:
      - scripts/windows-healthy-start.sh {{.BASE}}

  vm:tart-vnc-idle-repro:
    desc: 'Does tart abort when a VNC client connects after GAP seconds (default 70) with no client? Reproduces the macOS 27 host fault with a bare RFB client; exits 1 on a crash. Optional BASE=<golden>, HOLD=1 to keep a bare TCP connection open (the workaround; expect no crash). About 2.5 minutes; always stops and deletes the clone'
    cmds:
      - python3 scripts/tart-vnc-idle-repro.py --gap {{.GAP | default "70"}} {{if .BASE}}--base {{.BASE}}{{end}} {{if .HOLD}}--hold{{end}}

  vm:vnc-keeper-live:
    desc: 'Does the VNC keeper protect a tart guest on this macOS 27 host (ADR-0018)? A macOS clone survives 5 minutes with no other client, and a Linux clone survives 70 s; with the keeper killed, a macOS clone crashes after 70 s (the negative control); after `vm stop` no keeper and no clone remain. Optional MACOS_BASE, LINUX_BASE, IDLE, GAP. About 14 minutes; always stops and deletes its clones'
    deps: [cli:build]
    cmds:
      - scripts/vnc-keeper-live.sh

  vm:create-golden-macos:
    desc: 'Build a macOS golden that carries this checkout''s agent, not the Homebrew-bundled one. Needs NAME=<golden> (use a new name: a rebuild replaces a golden of the same name); optional VERSION (default 27). About 20 minutes when the base VM exists. Run it from a terminal that may reach guest IPs (macOS Local Network permission)'
    deps: [cli:build, agent:macos:build]
    vars:
      CLI: '{{.CLI_DIR}}/target/debug/testanyware'
    env:
      TESTANYWARE_AGENT_BIN_OVERRIDE: '{{.ROOT_DIR}}/agents/macos/.build/release/testanyware-agent'
    preconditions:
      - sh: test -n "{{.NAME}}"
        msg: 'set NAME=<a golden name that does not exist yet>'
    cmds:
      - '{{.CLI}} vm create-golden --platform macos --version {{.VERSION | default "27"}} --name {{.NAME}}'

  vm:ipsw-base-live:
    desc: 'Does `ensure_base_vm(27)` build testanyware-base-macos-27 from Apple''s IPSW and does the result pass its contract (SSH admin/admin, passwordless sudo, auto-login, no sleep)? A no-op build if the base exists. First run downloads about 25 GB; the install is about 4 minutes and Setup Assistant about 5 more. Run from a terminal that may reach guest IPs (macOS Local Network permission)'
    dir: '{{.CLI_DIR}}'
    env:
      TESTANYWARE_LIVE_IPSW_BASE: '1'
    cmds:
      - cargo test -p testanyware-vm --test ipsw-base-live -- --ignored --nocapture ensure_base_vm_live

  vm:setup-assistant-live:
    desc: 'Iterate on the Setup Assistant driver: run it against a clone of a never-booted IPSW VM, then check the result. Needs FRESH=<vm> (make one with `tart create <vm> --from-ipsw <cached ipsw>`); about 5 minutes, no reinstall. Keeps the clone as testanyware-base-livetest'
    dir: '{{.CLI_DIR}}'
    env:
      TESTANYWARE_LIVE_IPSW_BASE: '1'
      TESTANYWARE_IPSW_FRESH_VM: '{{.FRESH}}'
      TESTANYWARE_IPSW_KEEP: '1'
    preconditions:
      - sh: test -n "{{.FRESH}}"
        msg: 'set FRESH=<a never-booted VM made by `tart create --from-ipsw`>'
    cmds:
      - cargo test -p testanyware-vm --test ipsw-base-live -- --ignored --nocapture configure_fresh_clone_live

  # ---- Release (wrappers over scripts/release-*.sh; arguments pass through) --

  release:doctor:
    desc: Check the prerequisites for the release pipeline (read-only)
    cmds:
      - scripts/release-doctor.sh {{.CLI_ARGS}}

  release:candidate:
    desc: 'Build a release candidate of a local annotated tag: TAG=vX.Y.Z. Builds the notarised app and its zip, the archives of every target, the formula, the cask and manifest.json in target/candidates/<tag>. The tree must be clean and HEAD must be the tagged commit (in a jj checkout: git tag -a vX.Y.Z -m "Release vX.Y.Z" <commit>, then jj new <commit>). Publishes nothing. Long, and needs the notary profile of release:doctor'
    requires:
      vars: [TAG]
    cmds:
      - scripts/release-build.sh {{.TAG}}

  release:candidate-verify:
    desc: 'Verify a built candidate, read-only: TAG=vX.Y.Z. The local tag must still name the commit of manifest.json, and each artifact must have its recorded sha256. Prints the tag, the commit and the hashes that the later checks record'
    requires:
      vars: [TAG]
    cmds:
      - scripts/release_candidate.py verify --dir target/candidates/{{.TAG}} --tag {{.TAG}}

  release:linux-harness:
    desc: 'Run the Linux host harness of ADR-0009 on the aarch64 Linux binary of a candidate: TAG=vX.Y.Z (macOS host). Verifies the candidate, unpacks its archive into target/candidates/<tag>.checks/linux, and runs the ignored test with TESTANYWARE_LINUX_HARNESS=1, TESTANYWARE_LINUX_BIN and the ffmpeg libraries of the archive. Prints the sha256 of the archive and of the binary. The x86_64 builds are build-only, by an accepted limit. Needs the TestAnyware app running with its Local Network alert allowed, a free macOS guest slot and the network. A long run'
    requires:
      vars: [TAG]
    cmds:
      - scripts/release_candidate.py verify --dir target/candidates/{{.TAG}} --tag {{.TAG}}
      - |
        set -eu
        set -o pipefail
        out="$PWD/target/candidates/{{.TAG}}.checks/linux"
        archive="$PWD/target/candidates/{{.TAG}}/testanyware-{{.TAG}}-aarch64-unknown-linux-gnu.tar.xz"
        rm -rf "$out"
        mkdir -p "$out"
        tar -xJf "$archive" -C "$out" --strip-components=1
        shasum -a 256 "$archive" "$out/bin/testanyware"
        cd cli-rs
        TESTANYWARE_LINUX_HARNESS=1 TESTANYWARE_LINUX_BIN="$out/bin/testanyware" TESTANYWARE_FFMPEG_LIB_DIR="$out/lib" \
          cargo test -p testanyware-cli --test linux-host-harness -- --ignored --nocapture linux_host_harness 2>&1 | tee "$out/harness.log"
        grep -q '^test result: ok. 1 passed' "$out/harness.log" || { echo "the Linux harness did not report 1 passed test" >&2; exit 1; }

  release:app-verify:
    desc: 'Verify the release identity of an app bundle: APP=<bundle>. Bundle id dev.antony.TestAnyware, team TA43A4RUP3, hardened runtime, codesign --verify, spctl --assess as Notarized Developer ID, stapler validate. A development bundle fails'
    requires:
      vars: [APP]
    cmds:
      - scripts/verify-app.sh {{.CLI_ARGS}} "{{.APP}}"

  release:app-notarize:
    desc: 'Notarise, staple and zip a signed release bundle: APP=<bundle> OUT=<zip>. release:candidate does this for a candidate. Needs the notary profile of release:doctor'
    requires:
      vars: [APP, OUT]
    cmds:
      - scripts/notarize-app.sh "{{.APP}}" "{{.OUT}}"

  release:test:
    desc: Test the release pipeline without Apple, GitHub or the cross builds. The tag gate, the manifest and the rendering (python unittest in a scratch repository), the cask template, the identity refusals of verify-app.sh on a signed bundle, and release-publish.sh against local bare repositories and a fake gh (macOS host)
    cmds:
      - scripts/tests/release-pipeline-test.sh

  release:publish:
    desc: 'Publish a recorded candidate: TAG=vX.Y.Z. Pushes the existing local tag, creates the GitHub Release with the candidate archives, then pushes the formula and the cask to the tap. It never creates a tag and never rebuilds. Outward-facing'
    prompt: This pushes a tag, publishes a GitHub Release and pushes the Homebrew tap. Continue?
    requires:
      vars: [TAG]
    cmds:
      - scripts/release-publish.sh {{.TAG}}
